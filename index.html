<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de taller</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2a3d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taller">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#12202b;--mute:#5f6e7a;--line:#d3dce2;--nav:#0f2a3d;--ac:#0b6e8a;--br:#c98a2b;--ok:#2f8f5b;--bad:#c23b2e}
@media (prefers-color-scheme:dark){:root{--bg:#0b1218;--card:#141e27;--ink:#e9eef2;--mute:#90a0ac;--line:#2a3845;--nav:#08161f;--ac:#3fb0cf}}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Space Grotesk",system-ui,sans-serif}
h1,h2{margin:0;letter-spacing:-.02em}h1{font-size:1.6rem}h2{font-size:1.05rem;margin-bottom:10px}
header{background:var(--nav);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase}
main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:700;min-height:48px}
.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.muted{color:var(--mute)}
.tag{font-size:.8rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tag.w{border-color:var(--br);color:var(--br)}.tag.g{border-color:var(--ok);color:var(--ok)}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;box-sizing:border-box;min-height:46px}
textarea{min-height:70px}
.lr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mic{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 12px;min-height:38px}
.mic.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{background:none;border:0;padding:8px 12px;border-radius:999px;white-space:nowrap;font-weight:600;color:var(--mute)}
nav button[aria-current="true"]{background:var(--ac);color:#fff}
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%;text-align:left;color:inherit;background:none;border:0;padding:0}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.big button{min-height:78px;font-size:1.02rem;border-radius:14px;border:2px solid var(--ac);background:var(--card);color:var(--ink);font-weight:700}
.big button.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.status{padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin:10px 0;font-size:.95rem}
.status.err{border-color:var(--bad);color:var(--bad)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
.qr{display:grid;place-items:center;gap:8px;text-align:center;padding:16px;border:2px dashed var(--line);border-radius:10px}
.qr img{width:150px;height:150px;background:#fff;padding:6px;border-radius:6px}
.centerbox{max-width:380px;margin:60px auto;padding:0 16px}
a.link{color:var(--ac);word-break:break-all}
</style>
</head>
<body>
<header><b id="brand">Scotto</b><span><button class="btn o hide" id="instalarApp" style="padding:6px 12px;min-height:32px;margin-right:10px">📲 Instalar app</button><span id="userbar"></span></span></header>
<nav id="nav" class="hide"></nav>
<main id="m">Cargando…</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<script>
var CFG=window.SCOTTO_CONFIG;
var sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
var S={session:null,talleres:[],taller:null,vista:"panel",clientes:[],equipos:[],motores:[],ordenes:[],orden:null};
var m=document.getElementById("m"),nv=document.getElementById("nav");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function buscadorHtml(ph,val){return "<input id='buscar' type='search' placeholder='"+ph+"' value=\""+esc(val||"")+"\" autocomplete='off' style='margin-bottom:12px'>"}
function filtrarLista(txt,extra){
  var palabras=norm(txt).split(/\s+/).filter(Boolean),vis=0,items=m.querySelectorAll("[data-q]");
  items.forEach(function(el){var q=el.dataset.q,ok=palabras.every(function(p){return q.indexOf(p)>=0})&&(!extra||extra(el));el.style.display=ok?"":"none";if(ok)vis++});
  var nr=document.getElementById("sinres");if(nr)nr.classList.toggle("hide",vis>0||!items.length);
}
function say(id,msg,err){var s=document.getElementById(id);if(!s)return;s.className="status"+(err?" err":"");s.textContent=msg;s.classList.remove("hide")}
function medidorLabel(){return S.taller&&S.taller.rubro==="motos"?"Kilómetros":"Horas de motor"}
function equipoLabel(){return S.taller&&S.taller.rubro==="motos"?"Moto":"Embarcación"}

/* ---------------- arranque y sesión ---------------- */
var yaEntro=false;
async function boot(){
  var r=await sb.auth.getSession();S.session=r.data.session;
  if(S.session)yaEntro=true;
  sb.auth.onAuthStateChange(function(_e,sess){
    S.session=sess;
    if(sess){yaEntro=true;return}
    if(yaEntro)location.reload();
  });
  if(!S.session){renderAuth();return}
  await cargarTalleres();
}
function esPago(){return !!(S.taller&&S.taller.plan==="pago")}
function esDueno(){return !!(S.taller&&S.taller.rol==="dueno")}
async function cargarTalleres(){
  try{await sb.rpc("aceptar_invitaciones")}catch(e){}
  var cols="id,nombre,rubro,logo_url,plan,telefono,direccion,instagram,maps_url";
  var r=await sb.from("miembros").select("rol, talleres("+cols+",recordatorio_meses)");
  if(r.error)r=await sb.from("miembros").select("rol, talleres("+cols+")");
  if(r.error){renderError(r.error);return}
  S.talleres=(r.data||[]).map(function(x){return Object.assign({rol:x.rol},x.talleres)});
  if(!S.talleres.length){renderCrearTaller();return}
  S.taller=S.talleres[0];
  document.getElementById("userbar").innerHTML="<span class='muted' style='color:#cfe0ea'>"+esc(S.session.user.email)+"</span> <button class='btn o' id='salir' style='padding:6px 12px;min-height:32px;margin-left:10px'>Salir</button>";
  document.getElementById("salir").onclick=function(){sb.auth.signOut()};
  document.getElementById("brand").innerHTML=esc(S.taller.nombre)+" <span class='tag' style='background:"+(esPago()?"var(--ok)":"transparent")+";color:"+(esPago()?"#fff":"#cfe0ea")+";border-color:#cfe0ea;font-size:.7rem;vertical-align:middle'>"+(esPago()?"PLAN PAGO":"PLAN GRATIS")+"</span>";
  nv.classList.remove("hide");
  nv.innerHTML=(esDueno()?["panel","clientes","ordenes","stock","caja","plan","config"]:["panel","clientes","ordenes","stock","config"]).map(function(v){return "<button data-v='"+v+"'>"+({panel:"Panel",clientes:"Clientes",ordenes:"Órdenes",stock:"Stock",caja:"Caja",plan:"Mi Plan",config:"Configuración"})[v]+"</button>"}).join("");
  nv.querySelectorAll("button").forEach(function(b){b.onclick=function(){S.vista=b.dataset.v;S.orden=null;route()}});
  route();
}
function renderError(e){m.innerHTML="<div class='card'><b>Hubo un error</b><p class='muted'>"+esc(e.message||e)+"</p></div>"}

/* ---------------- login / registro ---------------- */
function renderAuth(){
  m.innerHTML="<div class='centerbox card'><h1>Ingresar</h1>"+
   "<div id='st' class='status hide'></div>"+
   "<label for='email'>Correo</label><input id='email' type='email' autocomplete='username'>"+
   "<label for='pass'>Contraseña</label><input id='pass' type='password' autocomplete='current-password'>"+
   "<div class='btns'><button class='btn' id='in'>Ingresar</button><button class='btn o' id='up'>Crear cuenta</button></div></div>";
  document.getElementById("in").onclick=function(){auth("in")};
  document.getElementById("up").onclick=function(){auth("up")};
}
async function auth(modo){
  var email=document.getElementById("email").value.trim(),pass=document.getElementById("pass").value;
  if(!email||pass.length<6){say("st","La contraseña debe tener al menos 6 caracteres.",true);return}
  var r=modo==="in"?await sb.auth.signInWithPassword({email:email,password:pass}):await sb.auth.signUp({email:email,password:pass});
  if(r.error){say("st",r.error.message,true);return}
  if(modo==="up"&&!r.data.session){say("st","Cuenta creada. Revisá tu correo para confirmar el ingreso y después entrá con tu contraseña.");return}
  S.session=r.data.session;await cargarTalleres();
}

/* ---------------- crear taller ---------------- */
function renderCrearTaller(){
  document.getElementById("userbar").innerHTML="<button class='btn o' id='salir' style='padding:6px 12px;min-height:32px'>Salir</button>";
  document.getElementById("salir").onclick=function(){sb.auth.signOut()};
  m.innerHTML="<div class='centerbox card'><h1>Creá tu taller</h1><p class='muted'>Es único, después podés cambiar todo esto desde Configuración.</p>"+
   "<div id='st' class='status hide'></div>"+
   "<label for='nom'>Nombre del taller</label><input id='nom' placeholder='SCOTTO Mecánica Náutica'>"+
   "<label for='rub'>Rubro</label><select id='rub'><option value='nautica'>Náutica</option><option value='motos'>Motos</option><option value='autos'>Autos</option></select>"+
   "<label for='logoIni'>Logo (opcional, lo podés agregar después)</label><input type='file' id='logoIni' accept='image/*'>"+
   "<div class='btns'><button class='btn' id='cr'>Crear</button></div></div>";
  document.getElementById("cr").onclick=async function(){
   var nom=document.getElementById("nom").value.trim();if(!nom){say("st","Ponele un nombre al taller.",true);return}
   var r=await sb.rpc("crear_taller",{p_nombre:nom,p_rubro:document.getElementById("rub").value});
   if(r.error){say("st",r.error.message,true);return}
   var logoFile=document.getElementById("logoIni").files[0];
   if(logoFile){
    var logoUrl=await subirLogo(r.data,logoFile);
    if(logoUrl)await sb.rpc("actualizar_datos_taller",{p_taller_id:r.data,p_nombre:nom,p_telefono:null,p_direccion:null,p_instagram:null,p_maps_url:null,p_logo_url:logoUrl});
   }
   await cargarTalleres();
  };
}

/* ---------------- router ---------------- */
function route(){
  if(!esDueno()&&(S.vista==="caja"||S.vista==="plan"))S.vista="panel";
  if(S.vista==="panel")renderPanel();
  else if(S.vista==="ficha")renderFicha();
  else if(S.vista==="patente")renderPatente();
  else if(S.vista==="clientes")renderClientes();
  else if(S.vista==="ordenes")renderOrdenes();
  else if(S.vista==="ordenForm")renderOrdenForm();
  else if(S.vista==="postForm")renderPostForm();
  else if(S.vista==="presuForm")renderPresuForm();
  else if(S.vista==="stock")renderStock();
  else if(S.vista==="caja")renderCaja();
  else if(S.vista==="plan")renderPlan();
  else if(S.vista==="config")renderConfig();
  nv.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-current",b.dataset.v===S.vista||((S.vista==="ordenForm"||S.vista==="postForm"||S.vista==="presuForm")&&b.dataset.v==="ordenes")||((S.vista==="ficha"||S.vista==="patente")&&b.dataset.v==="clientes"))});
}

/* ---------------- panel ---------------- */
async function renderPanel(){
  m.innerHTML="<h1>Panel</h1><p class='muted'>"+esc(S.taller.nombre)+"</p><div id='box'>Cargando…</div>";
  var r=await sb.from("ordenes").select("id,numero,estado,clientes(nombre)").order("creado",{ascending:false}).limit(8);
  if(r.error){document.getElementById("box").innerHTML=esc(r.error.message);return}
  var h="<div class='card'><h2>Últimas órdenes</h2>";
  h+=r.data.length?r.data.map(function(o){var cls=o.estado==="Listo"||o.estado==="Entregado"?"g":o.estado==="En reparación"?"w":"";
    return "<div class='lr' style='border-top:1px solid var(--line);padding:8px 0'><span>OT "+String(o.numero).padStart(6,"0")+" · "+esc(o.clientes?o.clientes.nombre:"")+"</span><span class='tag "+cls+"'>"+esc(o.estado)+"</span></div>"}).join(""):"<p class='muted'>Todavía no hay órdenes.</p>";
  h+="</div><div class='btns'><button class='btn' id='ir'>Nueva orden</button><button class='btn o' id='irPat'>📷 Buscar por patente</button></div>";
  h+="<div class='card' id='recBox' style='margin-top:16px'><h2>🔔 Mantenimientos para recordar</h2><span class='muted'>Buscando…</span></div>";
  document.getElementById("box").outerHTML=h;
  document.getElementById("ir").onclick=function(){S.orden={estado:"Recibido"};S.vista="ordenForm";route()};
  document.getElementById("irPat").onclick=function(){S.vista="patente";route()};
  cargarRecordatorios();
}

/* ---------------- recordatorios de mantenimiento ---------------- */
// Se calcula por tiempo: clientes cuyo último trabajo entregado tiene más de N meses
// y que no tienen otra orden en curso. N y los "ya avisé" se guardan en este dispositivo.
function lsGet(k,def){try{var v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function mesesRecordatorio(){return Number(S.taller.recordatorio_meses||lsGet("rec_meses_"+S.taller.id,S.taller.rubro==="motos"?6:12))||6}
function mesesTxt(n){return n+(n===1?" mes":" meses")}
function mesesEntre(a,b){return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())-(b.getDate()<a.getDate()?1:0)}
async function cargarRecordatorios(){
  var box=document.getElementById("recBox");if(!box)return;
  var sel="id,numero,estado,creado,cliente_id,equipos(nombre),clientes(nombre,telefono";
  var r=await sb.from("ordenes").select(sel+",recordatorio_orden_id)").order("creado",{ascending:false});
  if(r.error)r=await sb.from("ordenes").select(sel+")").order("creado",{ascending:false});
  if(!document.getElementById("recBox"))return;
  if(r.error){box.innerHTML="<h2>🔔 Mantenimientos para recordar</h2><span class='muted'>"+esc(r.error.message)+"</span>";return}
  var meses=mesesRecordatorio(),hoy=new Date(),avisados=lsGet("rec_avisados_"+S.taller.id,{}),porCliente={};
  (r.data||[]).forEach(function(o){if(!o.cliente_id||!o.creado)return;var c=porCliente[o.cliente_id]=porCliente[o.cliente_id]||{ultima:null,enCurso:false};
   if(o.estado==="Entregado"){if(!c.ultima||new Date(o.creado)>new Date(c.ultima.creado))c.ultima=o}else c.enCurso=true});
  var lista=Object.keys(porCliente).map(function(k){var c=porCliente[k];if(!c.ultima||c.enCurso)return null;
    var hace=mesesEntre(new Date(c.ultima.creado),hoy);if(hace<meses||avisados[k]===c.ultima.id||(c.ultima.clientes&&c.ultima.clientes.recordatorio_orden_id===c.ultima.id))return null;return {cid:k,o:c.ultima,hace:hace}}).filter(Boolean)
   .sort(function(a,b){return b.hace-a.hace});
  var h="<h2>🔔 Mantenimientos para recordar</h2><p class='muted' style='margin-top:0'>Clientes con el último trabajo entregado hace "+mesesTxt(meses)+" o más. Podés cambiar el plazo en Configuración.</p>";
  h+=lista.length?lista.map(function(x){var o=x.o,tel=telWa(o.clientes&&o.clientes.telefono);
   return "<div style='border-top:1px solid var(--line);padding:10px 0'><div class='lr'><b>"+esc(o.clientes?o.clientes.nombre:"")+"</b><span class='tag w'>hace "+mesesTxt(x.hace)+"</span></div>"+
    "<span class='muted'>"+esc(o.equipos?o.equipos.nombre+" · ":"")+"último trabajo: OT "+String(o.numero).padStart(6,"0")+" ("+new Date(o.creado).toLocaleDateString("es-AR")+")</span>"+
    "<div class='btns' style='margin-top:8px'>"+(tel?"<a class='btn' style='padding:6px 12px;min-height:0;text-decoration:none' target='_blank' rel='noopener' data-rec-wa='"+x.cid+"' href='https://wa.me/"+tel+"?text="+encodeURIComponent(mensajeRecordatorio(o,x.hace))+"'>📲 Recordar por WhatsApp</a>":"<span class='muted'>Sin teléfono cargado.</span>")+
    "<button class='btn o' style='padding:6px 12px;min-height:0' data-rec-ok='"+x.cid+"' data-oid='"+o.id+"'>Ya avisé</button></div></div>"}).join(""):"<p class='muted'>No hay mantenimientos pendientes de recordar. 👌</p>";
  box.innerHTML=h;
  async function marcar(cid,oid){
   var u=await sb.from("clientes").update({recordatorio_orden_id:oid}).eq("id",cid);
   if(u.error){var a=lsGet("rec_avisados_"+S.taller.id,{});a[cid]=oid;lsSet("rec_avisados_"+S.taller.id,a)}
  }
  box.querySelectorAll("[data-rec-ok]").forEach(function(b){b.onclick=async function(){await marcar(b.dataset.recOk,b.dataset.oid);cargarRecordatorios()}});
  box.querySelectorAll("[data-rec-wa]").forEach(function(a){a.addEventListener("click",function(){var ok=a.parentNode.querySelector("[data-rec-ok]");marcar(ok.dataset.recOk,ok.dataset.oid);setTimeout(cargarRecordatorios,500)})});
}
function mensajeRecordatorio(o,hace){
  var nombre=o.clientes&&o.clientes.nombre?o.clientes.nombre.split(" ")[0]:"",
      eq="tu "+(o.equipos&&o.equipos.nombre?o.equipos.nombre:equipoLabel().toLowerCase());
  return "Hola"+(nombre?" "+nombre:"")+", te escribimos de "+(S.taller.nombre||"el taller")+".\n\n"+
   "Ya pasaron "+mesesTxt(hace)+" desde el último service de "+eq+". Te recomendamos hacerle el mantenimiento para que siga funcionando bien.\n\n"+
   "¿Querés que coordinemos un turno?";
}

/* ---------------- clientes / equipos / motores ---------------- */
async function renderClientes(){
  m.innerHTML="<h1>Clientes</h1><div id='box'>Cargando…</div>";
  var r=await sb.from("clientes").select("id,nombre,telefono,equipos(id,nombre,matricula_patente,motores(id,marca,modelo,medidor,qr_token))").order("nombre");
  if(r.error){document.getElementById("box").innerHTML=esc(r.error.message);return}
  S.clientes=r.data||[];
  var h="<div class='btns' style='margin:12px 0'><button class='btn o' id='cPat'>📷 Buscar por "+patenteLabel().toLowerCase()+"</button></div>"+buscadorHtml("🔍 Buscar por nombre, teléfono, "+equipoLabel().toLowerCase()+", "+patenteLabel().toLowerCase()+" o motor",S.qClientes);
  h+="<div class='card'><h2>Nuevo cliente</h2><label for='cn'>Nombre</label><input id='cn'><label for='ct'>Teléfono</label><input id='ct'><div class='btns'><button class='btn' id='ca'>Agregar</button></div></div>";
  h+=S.clientes.map(function(c){
   var eq=(c.equipos||[]).map(function(e){var mot=(e.motores||[]).map(function(mo){return "<div class='lr' style='margin-top:6px'><span class='muted'>"+esc([mo.marca,mo.modelo].filter(Boolean).join(" "))+" · "+medidorLabel().toLowerCase()+": "+esc(mo.medidor||0)+"</span><span><button class='btn o' data-qr='"+mo.qr_token+"' style='padding:4px 10px;min-height:0'>Ver QR</button> <button class='btn d' data-del-motor='"+mo.id+"' style='padding:4px 10px;min-height:0'>Eliminar</button></span></div>"}).join("")||"<span class='muted'>Sin motor cargado.</span>";
    return "<div style='margin-top:8px'><div class='lr'><button class='link' data-ficha='"+e.id+"' style='background:none;border:0;padding:0;font-weight:700;text-align:left;color:var(--ac)'>"+esc(e.nombre)+(e.matricula_patente?" <span class='tag'>"+esc(e.matricula_patente)+"</span>":"")+" ›</button><button class='btn d' data-del-equipo='"+e.id+"' style='padding:4px 10px;min-height:0'>Eliminar "+equipoLabel().toLowerCase()+"</button></div>"+mot+"<button class='btn o' data-motor='"+e.id+"' style='margin-top:6px;padding:6px 12px;min-height:0'>+ Motor</button> <button class='btn o' data-patente='"+e.id+"' data-actual=\""+esc(e.matricula_patente||"")+"\" style='margin-top:6px;padding:6px 12px;min-height:0'>"+patenteLabel()+"</button></div>"}).join("")||"<button class='btn o' data-equipo='"+c.id+"'>+ "+equipoLabel()+"</button>";

function stopRec(){if(rec){try{rec.stop()}catch(e){}rec=null}}
function speech(onText,onEnd,cont){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say("st","Este navegador no permite dictar acá. Usá el micrófono del teclado del celular.",true);return null}
  var r=new SR();r.lang="es-AR";r.continuous=!!cont;r.interimResults=true;var fin="";
  r.onresult=function(e){var tmp="";for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript+" ";else tmp+=e.results[i][0].transcript}onText(fin,tmp)};
  r.onerror=function(e){say("st",e.error==="not-allowed"?"El micrófono está bloqueado en el navegador.":"No se pudo dictar ("+e.error+").",true)};
  r.onend=onEnd;try{r.start()}catch(e){return null}return r}
function micField(b){
  if(rec){stopRec();return}
  var el=document.getElementById("f_"+b.dataset.mic),base=el.value?el.value+" ":"";
  b.classList.add("rec");b.textContent="⏹";
  rec=speech(function(f,t){el.value=base+f+t},function(){b.classList.remove("rec");b.textContent="🎤";rec=null},false);
  if(!rec){b.classList.remove("rec");b.textContent="🎤"}}
function startFull(){

function shrink(file){return new Promise(function(res){var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var s=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){res(b)},"image/jpeg",.82)};img.src=u})}
async function procesarFoto(file){
  say("st","Preparando la foto…");
  var blob=await shrink(file);
  fotosNuevas.push(blob);
  document.getElementById("ph").insertAdjacentHTML("beforeend","<div class='muted'>Foto agregada, se sube al guardar.</div>");
  if(!esPago()){say("st","Foto guardada. Leer los datos de la foto con IA es una función del plan pago.");return}
  say("st","Leyendo los datos de la foto…");

  var c=document.getElementById("firmaPad"),ctx,dibujo=false,trazando=false,last=null;
  function prep(){var r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);
   ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.scale(d,d);ctx.lineWidth=2.5;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#12202b";dibujo=false}
  prep();

  c.onpointermove=function(e){if(!trazando)return;var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;dibujo=true};
  c.onpointerup=c.onpointercancel=function(){trazando=false};

  };

/* ---------------- aviso de estado por WhatsApp ---------------- */
function telWa(t){
  var d=String(t||"").replace(/[^0-9]/g,"");
  if(!d)return "";
  if(d.indexOf("00")===0)d=d.slice(2);
  if(d.indexOf("54")===0&&d.length>=12){if(d.charAt(2)!=="9")d="549"+d.slice(2);return d}
  if(d.charAt(0)==="0")d=d.slice(1);
  if(d.length===12){for(var a=2;a<=4;a++){if(d.substr(a,2)==="15"){d=d.slice(0,a)+d.slice(a+2);break}}}
  if(d.length===10)return "549"+d;
  return d;
}

  var t=S.taller||{},nombre=o.clientes&&o.clientes.nombre?o.clientes.nombre.split(" ")[0]:"",

      ot="OT "+String(o.numero).padStart(6,"0");

   "Recibido":"Recibimos "+eq+" en el taller. Tu número de orden es "+ot+". Te avisamos cuando tengamos el diagnóstico.",
   "Diagnóstico":"Ya estamos revisando "+eq+" ("+ot+"). En cuanto tengamos el diagnóstico te contamos.",
   "Presupuesto":"El presupuesto de "+eq+" ("+ot+") está listo. Te lo pasamos para que lo revises.",
   "Aprobado":"¡Gracias por aprobar el presupuesto! Arrancamos con el trabajo de "+eq+" ("+ot+").",
   "En reparación":"Estamos trabajando en "+eq+" ("+ot+"). Te avisamos cuando esté listo.",
   "Listo":"¡"+eq.charAt(0).toUpperCase()+eq.slice(1)+" ya se puede retirar! ("+ot+")"+(t.direccion?"\nTe esperamos en "+t.direccion+".":""),
   "Entregado":"Gracias por confiar en nosotros. Cualquier consulta sobre el trabajo de "+eq+" ("+ot+"), escribinos."

  return "Hola"+(nombre?" "+nombre:"")+", te escribimos de "+(t.nombre||"el taller")+".\n\n"+cuerpo;
}

async function eliminarPresupuesto(){

async function guardarPresupuesto(){
  say("st","Guardando…");
  var data={taller_id:S.taller.id,orden_id:S.orden.id,items:S.presu.items,total:calcTotal()};

  if(r.error){say("st",r.error.message,true);return null}

function generarPDF(){
  if(!window.jspdf){say("st","No se pudo cargar el generador de PDF.",true);return}
  var o=S.orden;
  var doc=new window.jspdf.jsPDF();
  doc.setFontSize(16);doc.text(String(S.taller.nombre),14,18);
  doc.setFontSize(11);doc.text("Presupuesto - OT "+String(o.numero).padStart(6,"0"),14,26);
  doc.text("Cliente: "+(o.clientes?o.clientes.nombre:"-"),14,34);
  doc.text(equipoLabel()+": "+(o.equipos?o.equipos.nombre:"-"),14,40);
  var y=52;
  doc.setFontSize(10);
  doc.text("Descripción",14,y);doc.text("Cant.",120,y);doc.text("P. Unit.",145,y);doc.text("Subtotal",175,y);
  y+=4;doc.line(14,y,196,y);y+=8;
  S.presu.items.forEach(function(it){
    doc.text(String(it.descripcion||"").slice(0,45),14,y);
    doc.text(String(it.cantidad||0),120,y);
    doc.text(money(it.precio),145,y);
    doc.text(money((Number(it.cantidad)||0)*(Number(it.precio)||0)),175,y);
    y+=7;
    if(y>270){doc.addPage();y=20}
  });
  y+=4;doc.line(14,y,196,y);y+=10;
  doc.setFontSize(13);doc.text("Total: "+money(calcTotal()),140,y);
  doc.save("presupuesto_OT"+String(o.numero).padStart(6,"0")+".pdf");
}
function enviarWhatsApp(){

  var msg="Presupuesto "+S.taller.nombre+" - OT "+String(o.numero).padStart(6,"0")+"\n\n"+lineas+"\n\nTotal: "+money(calcTotal());

async function ajustarStock(id,delta){

async function subirLogo(tallerId,file){

  }catch(e){return null}

function normPatente(p){return String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function patenteLabel(){return S.taller&&S.taller.rubro==="motos"?"Patente":"Matrícula"}
function renderPatente(){
  m.innerHTML="<h1>Buscar por "+patenteLabel().toLowerCase()+"</h1><div class='card'>"+
   (esPago()?"<button class='btn' id='patFoto' style='width:100%'>📷 Sacar foto a la "+patenteLabel().toLowerCase()+"</button>":
    "<button class='btn o' disabled style='width:100%'>🔒 Leer la "+patenteLabel().toLowerCase()+" con foto (plan pago)</button>")+
   "<input type='file' id='patFile' accept='image/*' capture='environment' class='hide'>"+
   "<label for='patTxt'>"+patenteLabel()+"</label><input id='patTxt' autocapitalize='characters' autocomplete='off' placeholder='AB123CD'>"+
   "<div id='st' class='status hide'></div>"+
   "<div class='btns'><button class='btn' id='patBuscar'>Buscar</button><button class='btn o' id='back'>Volver</button></div></div><div id='patRes'></div>";
  var txt=document.getElementById("patTxt");
  document.getElementById("patBuscar").onclick=function(){buscarPatente(txt.value)};
  txt.onkeydown=function(e){if(e.key==="Enter")buscarPatente(txt.value)};
  document.getElementById("back").onclick=function(){S.vista="panel";route()};
  var pf=document.getElementById("patFoto");
  if(pf){pf.onclick=function(){document.getElementById("patFile").click()};
   document.getElementById("patFile").onchange=function(e){var f=e.target.files[0];e.target.value="";if(f)leerPatenteFoto(f)}}
  txt.focus();
}
async function leerPatenteFoto(file){
  say("st","Leyendo la "+patenteLabel().toLowerCase()+"…");
  try{
   var blob=await shrink(file);
   var b64=await new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result.split(",")[1])};fr.readAsDataURL(blob)});
   var resp=await fetch("/api/leer-foto",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({modo:"patente",rubro:S.taller.rubro,imagen:b64,taller_id:S.taller.id,access_token:S.session.access_token})});
   var r=await resp.json();if(r.error)throw r.error;
   if(!r.patente){say("st","No se pudo leer. Probá con otra foto, más cerca y derecha, o escribila.",true);return}
   document.getElementById("patTxt").value=r.patente;
   buscarPatente(r.patente);
  }catch(e){say("st","No se pudo leer la foto. Escribí la "+patenteLabel().toLowerCase()+" a mano.",true)}
}
async function buscarPatente(txt){
  var q=normPatente(txt),res=document.getElementById("patRes");
  if(!q){say("st","Escribí la "+patenteLabel().toLowerCase()+".",true);return}
  say("st","Buscando "+q+"…");
  var r=await sb.from("equipos").select("id,nombre,matricula_patente,clientes(nombre)");
  if(r.error){say("st",r.error.message,true);return}
  var todos=(r.data||[]).filter(function(e){return normPatente(e.matricula_patente)});
  var exactos=todos.filter(function(e){return normPatente(e.matricula_patente)===q});
  if(exactos.length===1){abrirFicha(exactos[0].id);return}
  var lista=exactos.length?exactos:todos.filter(function(e){var p=normPatente(e.matricula_patente);return p.indexOf(q)>=0||q.indexOf(p)>=0});
  document.getElementById("st").classList.add("hide");
  res.innerHTML=lista.length?"<div class='card'><h2>"+(exactos.length?"Hay más de uno con esa "+patenteLabel().toLowerCase():"Parecidos")+"</h2>"+lista.map(function(e){
    return "<button class='item' data-ficha='"+e.id+"' style='border-top:1px solid var(--line);padding:10px 0'><span><b>"+esc(e.matricula_patente)+"</b> · "+esc(e.nombre)+"<br><span class='muted'>"+esc(e.clientes?e.clientes.nombre:"")+"</span></span><span>›</span></button>"}).join("")+"</div>":
   "<div class='card'><h2>No encontramos "+esc(q)+"</h2><p class='muted' style='margin:0'>Cargá la "+patenteLabel().toLowerCase()+" desde <b>Clientes</b> (botón \""+patenteLabel()+"\" debajo de cada "+equipoLabel().toLowerCase()+") para encontrarla la próxima vez.</p></div>";
  res.querySelectorAll("[data-ficha]").forEach(function(b){b.onclick=function(){abrirFicha(b.dataset.ficha)}});
}
function abrirFicha(equipoId){S.fichaId=equipoId;S.vista="ficha";route()}
async function renderFicha(){
  m.innerHTML="<h1>Ficha</h1><div id='box'>Cargando…</div>";
  var r=await sb.from("equipos").select("id,nombre,matricula_patente,notas,cliente_id,clientes(id,nombre,telefono),motores(id,marca,modelo,medidor,qr_token)").eq("id",S.fichaId).single();
  if(r.error){document.getElementById("box").innerHTML=esc(r.error.message);return}
  var e=r.data,c=e.clientes||{};
  var o=await sb.from("ordenes").select("id,numero,estado,creado,motivo,trabajos").eq("equipo_id",e.id).order("creado",{ascending:false});
  var ords=o.data||[],tel=telWa(c.telefono);
  var h="<h1>"+esc(e.nombre)+"</h1>"+(e.matricula_patente?"<p style='margin:4px 0 12px'><span class='tag' style='font-size:1rem;letter-spacing:.08em'>"+esc(e.matricula_patente)+"</span></p>":"");
  h+="<div class='card'><h2>Cliente</h2><b>"+esc(c.nombre||"")+"</b><br><span class='muted'>"+esc(c.telefono||"Sin teléfono")+"</span>"+
   (tel?"<div class='btns' style='margin-top:10px'><a class='btn o' style='padding:6px 12px;min-height:0;text-decoration:none' target='_blank' rel='noopener' href='https://wa.me/"+tel+"'>📲 WhatsApp</a><a class='btn o' style='padding:6px 12px;min-height:0;text-decoration:none' href='tel:"+esc(String(c.telefono).replace(/[^0-9+]/g,""))+"'>📞 Llamar</a></div>":"")+"</div>";
  h+="<div class='card'><h2>Motores</h2>"+((e.motores||[]).map(function(mo){return "<div class='lr' style='margin-top:6px'><span>"+esc([mo.marca,mo.modelo].filter(Boolean).join(" ")||"Motor")+"<br><span class='muted'>"+medidorLabel().toLowerCase()+": "+esc(mo.medidor||0)+"</span></span><button class='btn o' data-qr='"+mo.qr_token+"' style='padding:4px 10px;min-height:0'>Ver QR</button></div>"}).join("")||"<span class='muted'>Sin motor cargado.</span>")+"</div>";
  if(e.notas)h+="<div class='card'><h2>Notas</h2><p style='margin:0;white-space:pre-wrap'>"+esc(e.notas)+"</p></div>";
  h+="<div class='card'><h2>Historial ("+ords.length+")</h2>"+(ords.length?ords.map(function(x){var cls=x.estado==="Listo"||x.estado==="Entregado"?"g":x.estado==="En reparación"?"w":"";
    return "<button class='item' data-oid='"+x.id+"' style='border-top:1px solid var(--line);padding:10px 0'><span><b>OT "+String(x.numero).padStart(6,"0")+"</b> · "+new Date(x.creado).toLocaleDateString("es-AR")+"<br><span class='muted'>"+esc((x.trabajos||x.motivo||"").slice(0,90))+"</span></span><span class='tag "+cls+"'>"+esc(x.estado)+"</span></button>"}).join(""):"<span class='muted'>Todavía no hay órdenes para este "+equipoLabel().toLowerCase()+".</span>")+"</div>";
  h+="<div class='btns'><button class='btn' id='fNueva'>Nueva orden</button><button class='btn o' id='fPat'>✏️ "+patenteLabel()+"</button><button class='btn o' id='back'>Volver</button></div>";
  m.innerHTML=h;
  m.querySelectorAll("[data-qr]").forEach(function(b){b.onclick=function(){verQR(b.dataset.qr);window.scrollTo(0,0)}});
  m.querySelectorAll("[data-oid]").forEach(function(b){b.onclick=async function(){
   var x=await sb.from("ordenes").select("*").eq("id",b.dataset.oid).single();
   if(x.error){alert(x.error.message);return}S.orden=x.data;S.vista="ordenForm";route()}});
  document.getElementById("fNueva").onclick=function(){S.orden={estado:"Recibido",cliente_id:c.id,equipo_id:e.id,motor_id:(e.motores||[]).length===1?e.motores[0].id:null};S.vista="ordenForm";route()};
  document.getElementById("fPat").onclick=async function(){if(await editarPatente(e.id,e.matricula_patente))renderFicha()};
  document.getElementById("back").onclick=function(){S.vista="clientes";route()};
}
async function editarPatente(equipoId,actual){
  var p=prompt(patenteLabel()+":",actual||"");if(p==null)return false;
  p=p.trim().toUpperCase();
  var r=await sb.from("equipos").update({matricula_patente:p||null}).eq("id",equipoId);
  if(r.error){alert(r.error.message);return false}
  return true;
}

/* ---------------- instalar la app (PWA) ---------------- */
var promptInstalar=null;
document.getElementById("instalarApp").onclick=instalarApp;
function esInstalada(){return window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}
function esIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
if("serviceWorker" in navigator&&location.protocol!=="file:")window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();promptInstalar=e;pintarBotonInstalar()});
window.addEventListener("appinstalled",function(){promptInstalar=null;pintarBotonInstalar()});
function pintarBotonInstalar(){
  var b=document.getElementById("instalarApp");
  if(b)b.classList.toggle("hide",!promptInstalar||esInstalada());
  var c=document.getElementById("cardInstalar");
  if(c){c.outerHTML=cardInstalarHtml();conectarInstalar()}
}
async function instalarApp(){
  if(!promptInstalar)return;
  promptInstalar.prompt();
  await promptInstalar.userChoice;
  promptInstalar=null;pintarBotonInstalar();
}
function cardInstalarHtml(){
  var h="<div class='card' id='cardInstalar'><h2>📲 Instalar en el celular</h2>";
  if(esInstalada())h+="<p class='muted'>La app ya está instalada en este dispositivo.</p>";
  else if(promptInstalar)h+="<p class='muted'>Agregá la app a la pantalla de inicio para abrirla como cualquier otra aplicación, a pantalla completa.</p><div class='btns'><button class='btn' id='instalarCfg'>Instalar app</button></div>";
  else if(esIOS())h+="<p class='muted'>En iPhone: abrí esta página en <b>Safari</b>, tocá el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba) y elegí <b>Agregar a pantalla de inicio</b>.</p>";
  else h+="<p class='muted'>En Android: abrí esta página en <b>Chrome</b>, tocá el menú <b>⋮</b> y elegí <b>Instalar aplicación</b> (o <b>Agregar a pantalla de inicio</b>).</p>";
  return h+"</div>";
}
function conectarInstalar(){var b=document.getElementById("instalarCfg");if(b)b.onclick=instalarApp}

boot();
</script>
