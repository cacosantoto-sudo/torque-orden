/* ---------------- copia de datos del taller ---------------- */
async function traerTodo(tabla,sel){
  var out=[],desde=0,paso=1000;
  for(;;){
   var r=await sb.from(tabla).select(sel||"*").eq("taller_id",S.taller.id).range(desde,desde+paso-1);
   if(r.error)throw new Error(tabla+": "+r.error.message);
   out=out.concat(r.data||[]);
   if(!r.data||r.data.length<paso)return out;
   desde+=paso;
  }
}
function descargarArchivo(nombre,contenido,tipo){
  var url=URL.createObjectURL(new Blob([contenido],{type:tipo})),a=document.createElement("a");
  a.href=url;a.download=nombre;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},2000);
}
function nombreArchivo(ext){return "torque-orden_"+norm(S.taller.nombre).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"_"+new Date().toISOString().slice(0,10)+"."+ext}
async function exportarJson(){
  say("expSt","Preparando la copia…");
  try{
   var tablas=["clientes","equipos","motores","ordenes","presupuestos","repuestos","movimientos_caja","fotos"],datos={};
   for(var i=0;i<tablas.length;i++)datos[tablas[i]]=await traerTodo(tablas[i]);
   var total=tablas.reduce(function(s,t){return s+datos[t].length},0);
   var copia={app:"Torque & Orden",version:1,generado:new Date().toISOString(),taller:{id:S.taller.id,nombre:S.taller.nombre,rubro:S.taller.rubro},datos:datos};
   descargarArchivo(nombreArchivo("json"),JSON.stringify(copia,null,1),"application/json");
   say("expSt","Listo: "+total+" registros ("+datos.clientes.length+" clientes, "+datos.ordenes.length+" órdenes). Las fotos no van en este archivo; siguen guardadas en la nube.");
  }catch(e){say("expSt","No se pudo generar la copia: "+e.message,true)}
}
function celdaCsv(v){v=v==null?"":String(v);return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function exportarCsv(){
  say("expSt","Preparando el archivo…");
  try{
   var ords=await traerTodo("ordenes","numero,estado,creado,motivo,diagnostico,trabajos,repuestos,observaciones,medidor,clientes(nombre,telefono),equipos(nombre,matricula_patente)");
   ords.sort(function(a,b){return (a.numero||0)-(b.numero||0)});
   var filas=[["OT","Fecha","Estado","Cliente","Teléfono",equipoLabel(),patenteLabel(),medidorLabel(),"Motivo","Diagnóstico","Trabajos","Repuestos","Observaciones"]];
   ords.forEach(function(o){filas.push(["OT "+String(o.numero).padStart(6,"0"),o.creado?new Date(o.creado).toLocaleDateString("es-AR"):"",o.estado,
    o.clientes?o.clientes.nombre:"",o.clientes?o.clientes.telefono:"",o.equipos?o.equipos.nombre:"",o.equipos?o.equipos.matricula_patente:"",o.medidor,
    o.motivo,o.diagnostico,o.trabajos,o.repuestos,o.observaciones])});
   descargarArchivo(nombreArchivo("csv"),"﻿"+filas.map(function(f){return f.map(celdaCsv).join(";")}).join("\r\n"),"text/csv;charset=utf-8");
   say("expSt","Listo: "+ords.length+" órdenes. Abrilo con Excel o Google Sheets.");
  }catch(e){say("expSt","No se pudo generar el archivo: "+e.message,true)}
}
async function guardarConfig(){
  say("st","Guardando…");
  var logoUrl=S.taller.logo_url||null;
  if(nuevoLogo){
   var subida=await subirLogo(S.taller.id,nuevoLogo);
   if(!subida){say("st","No se pudo subir el logo. Revisá que exista el bucket 'logos' en Supabase.",true);return}
   logoUrl=subida;
  }
  var r=await sb.rpc("actualizar_datos_taller",{
   p_taller_id:S.taller.id,
   p_nombre:document.getElementById("cnom").value.trim(),
   p_telefono:document.getElementById("ctel").value.trim()||null,
   p_direccion:document.getElementById("cdir").value.trim()||null,
   p_instagram:document.getElementById("cinsta").value.trim()||null,
   p_maps_url:document.getElementById("cmaps").value.trim()||null,
   p_logo_url:logoUrl
  });
  if(r.error){say("st",r.error.message,true);return}
  Object.assign(S.taller,{nombre:document.getElementById("cnom").value.trim(),telefono:document.getElementById("ctel").value.trim(),direccion:document.getElementById("cdir").value.trim(),instagram:document.getElementById("cinsta").value.trim(),maps_url:document.getElementById("cmaps").value.trim(),logo_url:logoUrl});
  pintarMarca();
  nuevoLogo=null;
  var pago={p_taller_id:S.taller.id,p_alias:document.getElementById("calias").value.trim(),p_cbu:document.getElementById("ccbu").value.trim(),p_titular:document.getElementById("ctit").value.trim()};
  if(pago.p_alias||pago.p_cbu||pago.p_titular||S.taller.alias_pago||S.taller.cbu_pago||S.taller.titular_pago){
   var rp=await sb.rpc("actualizar_pago_taller",pago);
   if(rp.error){say("st",/actualizar_pago_taller|function|schema cache/i.test(rp.error.message)?"Se guardaron los datos del taller, pero no el alias: falta correr el SQL nuevo en Supabase.":rp.error.message,true);return}
   S.taller.alias_pago=pago.p_alias||null;S.taller.cbu_pago=pago.p_cbu.replace(/[^0-9]/g,"")||null;S.taller.titular_pago=pago.p_titular||null;
  }
  say("st","Guardado.");
}
async function subirLogo(tallerId,file){
  try{
   var blob=await shrink(file);
   var path=tallerId+"/logo_"+Date.now()+".jpg";
   var up=await sb.storage.from("logos").upload(path,blob,{contentType:"image/jpeg"});
   if(up.error)return null;
   var pub=sb.storage.from("logos").getPublicUrl(path);
   return pub.data?pub.data.publicUrl:null;
  }catch(e){return null}
}

/* ---------------- empleados ---------------- */
async function cargarEmpleados(){
  var box=document.getElementById("empList");if(!box)return;
  var r=await sb.rpc("equipo_del_taller",{p_taller_id:S.taller.id});
  if(r.error){box.innerHTML="<p class='muted'>Para usar empleados primero hay que correr el SQL nuevo en Supabase.</p>";return}
  box.innerHTML=(r.data||[]).map(function(x){
   var tag=x.pendiente?"<span class='tag w'>Invitación pendiente</span>":x.rol==="dueno"?"<span class='tag g'>Dueño</span>":"<span class='tag'>Empleado</span>";
   var btn=x.pendiente?"<button class='btn d' style='padding:4px 10px;min-height:0' data-emp-cancel=\""+esc(x.email)+"\">Cancelar</button>":
    x.rol!=="dueno"?"<button class='btn d' style='padding:4px 10px;min-height:0' data-emp-quitar='"+x.usuario_id+"' data-email=\""+esc(x.email)+"\">Quitar</button>":"";
   return "<div class='lr' style='border-top:1px solid var(--line);padding:8px 0;flex-wrap:wrap'><span style='word-break:break-all'>"+esc(x.email)+"</span><span>"+tag+" "+btn+"</span></div>"}).join("");
  box.querySelectorAll("[data-emp-cancel]").forEach(function(b){b.onclick=async function(){
   var r=await sb.rpc("cancelar_invitacion",{p_taller_id:S.taller.id,p_email:b.dataset.empCancel});
   if(r.error){say("empSt",r.error.message,true);return}cargarEmpleados()}});
  box.querySelectorAll("[data-emp-quitar]").forEach(function(b){b.onclick=async function(){
   if(!confirm("¿Quitar a "+b.dataset.email+" del taller? Ya no va a poder entrar a los datos del taller."))return;
   var r=await sb.rpc("quitar_empleado",{p_taller_id:S.taller.id,p_usuario_id:b.dataset.empQuitar});
   if(r.error){say("empSt",r.error.message,true);return}cargarEmpleados()}});
}
async function invitarEmpleado(){
  var el=document.getElementById("empMail"),mail=el.value.trim();
  if(!mail){say("empSt","Escribí el correo del empleado.",true);return}
  var r=await sb.rpc("invitar_empleado",{p_taller_id:S.taller.id,p_email:mail});
  if(r.error){say("empSt",r.error.message,true);return}
  el.value="";say("empSt","Invitación creada. Avisale que entre a esta página y cree su cuenta con "+mail+".");
  cargarEmpleados();
}

/* ---------------- patente y ficha del vehículo ---------------- */
function plateHtml(p,size){return "<span class='plate "+(size||"")+"'><span>"+esc(String(p).toUpperCase())+"</span></span>"}
function normPatente(p){return String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function patenteLabel(){return S.taller&&S.taller.rubro==="motos"?"Patente":"Matrícula"}
function renderPatente(){
  m.innerHTML="<h1>Buscar por "+patenteLabel().toLowerCase()+"</h1><div class='card'>"+
   (esPago()?"<button class='btn' id='patFoto' style='width:100%'>"+ic("camera")+" Sacar foto a la "+patenteLabel().toLowerCase()+"</button>":
    "<button class='btn o' disabled style='width:100%'>"+ic("lock")+" Leer la "+patenteLabel().toLowerCase()+" con foto (plan pago)</button>")+
   "<input type='file' id='patFile' accept='image/*' capture='environment' class='hide'>"+
   "<label for='patTxt'>"+patenteLabel()+"</label><input id='patTxt' autocapitalize='characters' autocomplete='off' placeholder='AB123CD'>"+
   "<div id='st' class='status hide'></div>"+
   "<div class='btns'><button class='btn' id='patBuscar'>Buscar</button><button class='btn o' id='back'>Volver</button></div></div><div id='patRes'></div>";
  var txt=document.getElementById("patTxt");
  document.getElementById("patBuscar").onclick=function(){buscarPatente(txt.value)};
  txt.onkeydown=function(e){if(e.key==="Enter")buscarPatente(txt.value)};
  document.getElementById("back").onclick=function(){S.vista="panel";route()};
  var pf=document.getElementById("patFoto");
  if(pf){pf.onclick=function(){document.getElementById("patFile").click()};
   document.getElementById("patFile").onchange=function(e){var f=e.target.files[0];e.target.value="";if(f)leerPatenteFoto(f)}}
  txt.focus();
}
async function leerPatenteFoto(file){
  say("st","Leyendo la "+patenteLabel().toLowerCase()+"…");
  try{
   var blob=await shrink(file);
   var b64=await new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result.split(",")[1])};fr.readAsDataURL(blob)});
   var resp=await fetch("/api/leer-foto",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({modo:"patente",rubro:S.taller.rubro,imagen:b64,taller_id:S.taller.id,access_token:S.session.access_token})});
   var r=await resp.json();if(r.error)throw r.error;
   if(!r.patente){say("st","No se pudo leer. Probá con otra foto, más cerca y derecha, o escribila.",true);return}
   document.getElementById("patTxt").value=r.patente;
   buscarPatente(r.patente);
  }catch(e){say("st","No se pudo leer la foto. Escribí la "+patenteLabel().toLowerCase()+" a mano.",true)}
}
async function buscarPatente(txt){
  var q=normPatente(txt),res=document.getElementById("patRes");
  if(!q){say("st","Escribí la "+patenteLabel().toLowerCase()+".",true);return}
  say("st","Buscando "+q+"…");
  var r=await sb.from("equipos").select("id,nombre,matricula_patente,clientes(nombre)");
  if(r.error){say("st",r.error.message,true);return}
  var todos=(r.data||[]).filter(function(e){return normPatente(e.matricula_patente)});
  var exactos=todos.filter(function(e){return normPatente(e.matricula_patente)===q});
  if(exactos.length===1){abrirFicha(exactos[0].id);return}
  var lista=exactos.length?exactos:todos.filter(function(e){var p=normPatente(e.matricula_patente);return p.indexOf(q)>=0||q.indexOf(p)>=0});
  document.getElementById("st").classList.add("hide");
  res.innerHTML=lista.length?"<div class='card'><h2>"+(exactos.length?"Hay más de uno con esa "+patenteLabel().toLowerCase():"Parecidos")+"</h2>"+lista.map(function(e){
    return "<button class='item' data-ficha='"+e.id+"' style='border-top:1px solid var(--line);padding:10px 0'><span>"+plateHtml(e.matricula_patente,"sm")+" "+esc(e.nombre)+"<br><span class='muted'>"+esc(e.clientes?e.clientes.nombre:"")+"</span></span><span>›</span></button>"}).join("")+"</div>":
   "<div class='card'><h2>No encontramos "+esc(q)+"</h2><p class='muted' style='margin:0'>Cargá la "+patenteLabel().toLowerCase()+" desde <b>Clientes</b> (botón \""+patenteLabel()+"\" debajo de cada "+equipoLabel().toLowerCase()+") para encontrarla la próxima vez.</p></div>";
  res.querySelectorAll("[data-ficha]").forEach(function(b){b.onclick=function(){abrirFicha(b.dataset.ficha)}});
}
function abrirFicha(equipoId){S.fichaId=equipoId;S.vista="ficha";route()}
async function renderFicha(){
  m.innerHTML="<h1>Ficha</h1><div id='box'>"+skel()+"</div>";
  var r=await sb.from("equipos").select("id,nombre,matricula_patente,notas,cliente_id,clientes(id,nombre,telefono),motores(id,marca,modelo,medidor,qr_token)").eq("id",S.fichaId).single();
  if(r.error){document.getElementById("box").innerHTML=esc(r.error.message);return}
  var e=r.data,c=e.clientes||{};
  var o=await sb.from("ordenes").select("id,numero,estado,creado,motivo,trabajos").eq("equipo_id",e.id).order("creado",{ascending:false});
  var ords=o.data||[],tel=telWa(c.telefono);
  var h="<h1>"+esc(e.nombre)+"</h1>"+(e.matricula_patente?"<p style='margin:10px 0 14px'>"+plateHtml(e.matricula_patente,"lg")+"</p>":"");
  h+="<div class='card'><h2>Cliente</h2><b>"+esc(c.nombre||"")+"</b><br><span class='muted'>"+esc(c.telefono||"Sin teléfono")+"</span>"+
   (tel?"<div class='btns' style='margin-top:10px'><a class='btn o' style='padding:6px 12px;min-height:0;text-decoration:none' target='_blank' rel='noopener' href='https://wa.me/"+tel+"'>"+ic("message")+" WhatsApp</a><a class='btn o' style='padding:6px 12px;min-height:0;text-decoration:none' href='tel:"+esc(String(c.telefono).replace(/[^0-9+]/g,""))+"'>"+ic("phone")+" Llamar</a></div>":"")+"</div>";
  h+="<div class='card'><h2>Motores</h2>"+((e.motores||[]).map(function(mo){return "<div class='lr' style='margin-top:6px'><span>"+esc([mo.marca,mo.modelo].filter(Boolean).join(" ")||"Motor")+"<br><span class='muted'>"+medidorLabel().toLowerCase()+": "+esc(mo.medidor||0)+"</span></span><button class='btn o' data-qr='"+mo.qr_token+"' style='padding:4px 10px;min-height:0'>Ver QR</button></div>"}).join("")||"<span class='muted'>Sin motor cargado.</span>")+"</div>";
  if(e.notas)h+="<div class='card'><h2>Notas</h2><p style='margin:0;white-space:pre-wrap'>"+esc(e.notas)+"</p></div>";
  h+="<div class='card'><h2>Historial ("+ords.length+")</h2>"+(ords.length?ords.map(function(x){var cls=x.estado==="Listo"||x.estado==="Entregado"?"g":x.estado==="En reparación"?"w":"";
    return "<button class='item' data-oid='"+x.id+"' style='border-top:1px solid var(--line);padding:10px 0'><span><b>OT "+String(x.numero).padStart(6,"0")+"</b> · "+new Date(x.creado).toLocaleDateString("es-AR")+"<br><span class='muted'>"+esc((x.trabajos||x.motivo||"").slice(0,90))+"</span></span><span class='tag "+cls+"'>"+esc(x.estado)+"</span></button>"}).join(""):"<span class='muted'>Todavía no hay órdenes para este "+equipoLabel().toLowerCase()+".</span>")+"</div>";
  h+="<div class='btns'><button class='btn' id='fNueva'>Nueva orden</button><button class='btn o' id='fPat'>"+ic("pencil")+" "+patenteLabel()+"</button><button class='btn o' id='back'>Volver</button></div>";
  m.innerHTML=h;
  m.querySelectorAll("[data-qr]").forEach(function(b){b.onclick=function(){verQR(b.dataset.qr);window.scrollTo(0,0)}});
  m.querySelectorAll("[data-oid]").forEach(function(b){b.onclick=async function(){
   var x=await sb.from("ordenes").select("*").eq("id",b.dataset.oid).single();
   if(x.error){alert(x.error.message);return}S.orden=x.data;S.vista="ordenForm";route()}});
  document.getElementById("fNueva").onclick=function(){S.orden={estado:"Recibido",cliente_id:c.id,equipo_id:e.id,motor_id:(e.motores||[]).length===1?e.motores[0].id:null};S.vista="ordenForm";route()};
  document.getElementById("fPat").onclick=async function(){if(await editarPatente(e.id,e.matricula_patente))renderFicha()};
  document.getElementById("back").onclick=function(){S.vista="clientes";route()};
}
async function editarPatente(equipoId,actual){
  var p=prompt(patenteLabel()+":",actual||"");if(p==null)return false;
  p=p.trim().toUpperCase();
  var r=await sb.from("equipos").update({matricula_patente:p||null}).eq("id",equipoId);
  if(r.error){alert(r.error.message);return false}
  return true;
}

/* ---------------- instalar la app (PWA) ---------------- */
var promptInstalar=null;
document.getElementById("instalarApp").onclick=instalarApp;
function esInstalada(){return window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}
function esIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
if("serviceWorker" in navigator&&location.protocol!=="file:")window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();promptInstalar=e;pintarBotonInstalar()});
window.addEventListener("appinstalled",function(){promptInstalar=null;pintarBotonInstalar()});
function pintarBotonInstalar(){
  var b=document.getElementById("instalarApp");
  if(b)b.classList.toggle("hide",!promptInstalar||esInstalada());
  var c=document.getElementById("cardInstalar");
  if(c){c.outerHTML=cardInstalarHtml();conectarInstalar()}
  pintarAvisoInstalar();
}
async function instalarApp(){
  if(!promptInstalar)return;
  promptInstalar.prompt();
  await promptInstalar.userChoice;
  promptInstalar=null;pintarBotonInstalar();
}
function cardInstalarHtml(){
  var h="<div class='card' id='cardInstalar'><h2>Instalar en el celular</h2>";
  if(esInstalada())h+="<p class='muted'>La app ya está instalada en este dispositivo.</p>";
  else if(promptInstalar)h+="<p class='muted'>Agregá la app a la pantalla de inicio para abrirla como cualquier otra aplicación, a pantalla completa.</p><div class='btns'><button class='btn' id='instalarCfg'>Instalar app</button></div>";
  else h+="<p class='muted'>"+instruccionesInstalar()+"</p>";
  return h+"</div>";
}
function conectarInstalar(){var b=document.getElementById("instalarCfg");if(b)b.onclick=instalarApp}
// Navegadores dentro de otras apps (Instagram, Facebook, etc.) no permiten instalar.
function enAppAjena(){return /FBAN|FBAV|Instagram|Line\/|WhatsApp|TikTok|musical_ly|; wv\)/i.test(navigator.userAgent)}
function esCelular(){return esIOS()||/Android|Mobile/i.test(navigator.userAgent)}
function instruccionesInstalar(){
  if(enAppAjena())return "Estás viendo la app dentro de otra aplicación y desde acá no se puede instalar. Tocá el menú <b>⋮</b> o <b>···</b> y elegí <b>Abrir en el navegador</b> ("+(esIOS()?"Safari":"Chrome")+"). Ahí vas a poder instalarla.";
  if(esIOS())return /CriOS|FxiOS|EdgiOS/.test(navigator.userAgent)?
    "En iPhone: tocá el botón <b>Compartir</b> (el cuadrado con la flecha ⬆️, arriba a la derecha) y elegí <b>Agregar a pantalla de inicio</b>. Si no aparece, abrí esta página en <b>Safari</b>.":
    "En iPhone: tocá el botón <b>Compartir</b> (el cuadrado con la flecha ⬆️, abajo en el centro), deslizá y elegí <b>Agregar a pantalla de inicio</b>.";
  if(/SamsungBrowser/.test(navigator.userAgent))return "En Samsung Internet: tocá el menú <b>☰</b> y elegí <b>Agregar página a</b> → <b>Pantalla de inicio</b>. También podés abrirla en <b>Chrome</b> y tocar <b>⋮</b> → <b>Instalar aplicación</b>.";
  return "En Android: tocá el menú <b>⋮</b> (arriba a la derecha) y elegí <b>Instalar aplicación</b> o <b>Agregar a pantalla de inicio</b>. Si no aparece, abrí esta página en <b>Chrome</b>.";
}
// Aviso abajo en celulares que todavía no tienen la app instalada.
function pintarAvisoInstalar(){
  var a=document.getElementById("avisoInstalar");
  var cerrado=false;try{cerrado=localStorage.getItem("avisoInstalarCerrado")==="1"}catch(e){}
  if(esInstalada()||!esCelular()||cerrado){if(a)a.remove();return}
  if(!a){a=document.createElement("div");a.id="avisoInstalar";document.body.appendChild(a)}
  a.style.cssText="position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;background:#151515;border:1px solid var(--line2);border-left:4px solid var(--ac);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:.92rem";
  a.innerHTML="<div class='lr' style='align-items:flex-start'><b style='font-family:var(--f-head);text-transform:uppercase;letter-spacing:.05em;font-size:1.05rem;display:flex;align-items:center;gap:8px'>"+ic("smartphone")+"Instalá Torque &amp; Orden</b><button id='avisoCerrar' aria-label='Cerrar' style='background:none;border:0;color:var(--mute);font-size:1.3rem;line-height:1;padding:0 4px'>×</button></div>"+
   (promptInstalar?"<div class='btns' style='margin-top:8px'><button class='btn' id='avisoInstalarBtn'>Instalar app</button></div>":"<p style='margin:6px 0 0;color:var(--mute)'>"+instruccionesInstalar()+"</p>");
  document.getElementById("avisoCerrar").onclick=function(){try{localStorage.setItem("avisoInstalarCerrado","1")}catch(e){}a.remove()};
  var ib=document.getElementById("avisoInstalarBtn");if(ib)ib.onclick=instalarApp;
}

boot();
setTimeout(pintarAvisoInstalar,1500);
</script>
