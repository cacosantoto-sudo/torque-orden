<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#12202b;--mute:#5f6e7a;--line:#d3dce2;--nav:#0f2a3d;--ac:#0b6e8a;--br:#c98a2b;--ok:#2f8f5b;--bad:#c23b2e}
@media (prefers-color-scheme:dark){:root{--bg:#0b1218;--card:#141e27;--ink:#e9eef2;--mute:#90a0ac;--line:#2a3845;--nav:#08161f;--ac:#3fb0cf}}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Space Grotesk",system-ui,sans-serif}
h1,h2{margin:0;letter-spacing:-.02em}h1{font-size:1.6rem}h2{font-size:1.05rem;margin-bottom:10px}
header{background:var(--nav);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:1.2rem;letter-spacing:.04em;text-transform:uppercase}
main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:700;min-height:48px}
.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.muted{color:var(--mute)}
.tag{font-size:.8rem;padding:2px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tag.w{border-color:var(--br);color:var(--br)}.tag.g{border-color:var(--ok);color:var(--ok)}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;box-sizing:border-box;min-height:46px}
textarea{min-height:70px}
.lr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mic{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 12px;min-height:38px}
.mic.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{background:none;border:0;padding:8px 12px;border-radius:999px;white-space:nowrap;font-weight:600;color:var(--mute)}
nav button[aria-current="true"]{background:var(--ac);color:#fff}
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%;text-align:left;color:inherit;background:none;border:0;padding:0}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.big button{min-height:78px;font-size:1.02rem;border-radius:14px;border:2px solid var(--ac);background:var(--card);color:var(--ink);font-weight:700}
.big button.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.status{padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin:10px 0;font-size:.95rem}
.status.err{border-color:var(--bad);color:var(--bad)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
.qr{display:grid;place-items:center;gap:8px;text-align:center;padding:16px;border:2px dashed var(--line);border-radius:10px}
.qr img{width:150px;height:150px;background:#fff;padding:6px;border-radius:6px}
.centerbox{max-width:380px;margin:60px auto;padding:0 16px}
a.link{color:var(--ac);word-break:break-all}
</style>
</head>
<body>
<header><b id="brand">Scotto</b><span id="userbar"></span></header>
<nav id="nav" class="hide"></nav>
<main id="m">Cargando…</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var CFG=window.SCOTTO_CONFIG;
var sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
var S={session:null,talleres:[],taller:null,vista:"panel",clientes:[],equipos:[],motores:[],ordenes:[],orden:null};
var m=document.getElementById("m"),nv=document.getElementById("nav");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function say(id,msg,err){var s=document.getElementById(id);if(!s)return;s.className="status"+(err?" err":"");s.textContent=msg;s.classList.remove("hide")}
function medidorLabel(){return S.taller&&S.taller.rubro==="motos"?"Kilómetros":"Horas de motor"}
function equipoLabel(){return S.taller&&S.taller.rubro==="motos"?"Moto":"Embarcación"}

/* ---------------- arranque y sesión ---------------- */
async function boot(){
  var r=await sb.auth.getSession();S.session=r.data.session;
  sb.auth.onAuthStateChange(function(_e,sess){S.session=sess;if(!sess)location.reload()});
  if(!S.session){renderAuth();return}
  await cargarTalleres();
}
async function cargarTalleres(){
  var r=await sb.from("miembros").select("rol, talleres(id,nombre,rubro,logo_url)");
  if(r.error){renderError(r.error);return}
  S.talleres=(r.data||[]).map(function(x){return Object.assign({rol:x.rol},x.talleres)});
  if(!S.talleres.length){renderCrearTaller();return}
  S.taller=S.talleres[0];
  document.getElementById("userbar").innerHTML="<span class='muted' style='color:#cfe0ea'>"+esc(S.session.user.email)+"</span> <button class='btn o' id='salir' style='padding:6px 12px;min-height:32px;margin-left:10px'>Salir</button>";
  document.getElementById("salir").onclick=function(){sb.auth.signOut()};
  document.getElementById("brand").textContent=S.taller.nombre;
  nv.classList.remove("hide");
  nv.innerHTML=["panel","clientes","ordenes"].map(function(v){return "<button data-v='"+v+"'>"+({panel:"Panel",clientes:"Clientes",ordenes:"Órdenes"})[v]+"</button>"}).join("");
  nv.querySelectorAll("button").forEach(function(b){b.onclick=function(){S.vista=b.dataset.v;S.orden=null;route()}});
  route();
}
function renderError(e){m.innerHTML="<div class='card'><b>Hubo un error</b><p class='muted'>"+esc(e.message||e)+"</p></div>"}

/* ---------------- login / registro ---------------- */
function renderAuth(){
  m.innerHTML="<div class='centerbox card'><h1>Ingresar</h1>"+
   "<div id='st' class='status hide'></div>"+
   "<label for='email'>Correo</label><input id='email' type='email' autocomplete='username'>"+
   "<label for='pass'>Contraseña</label><input id='pass' type='password' autocomplete='current-password'>"+
   "<div class='btns'><button class='btn' id='in'>Ingresar</button><button class='btn o' id='up'>Crear cuenta</button></div></div>";
  document.getElementById("in").onclick=function(){auth("in")};
  document.getElementById("up").onclick=function(){auth("up")};
}
async function auth(modo){
  var email=document.getElementById("email").value.trim(),pass=document.getElementById("pass").value;
  if(!email||pass.length<6){say("st","La contraseña debe tener al menos 6 caracteres.",true);return}
  var r=modo==="in"?await sb.auth.signInWithPassword({email:email,password:pass}):await sb.auth.signUp({email:email,password:pass});
  if(r.error){say("st",r.error.message,true);return}
  if(modo==="up"&&!r.data.session){say("st","Cuenta creada. Revisá tu correo para confirmar el ingreso y después entrá con tu contraseña.");return}
  S.session=r.data.session;await cargarTalleres();
}

/* ---------------- crear taller ---------------- */
function renderCrearTaller(){
  document.getElementById("userbar").innerHTML="<button class='btn o' id='salir' style='padding:6px 12px;min-height:32px'>Salir</button>";
  document.getElementById("salir").onclick=function(){sb.auth.signOut()};
  m.innerHTML="<div class='centerbox card'><h1>Creá tu taller</h1><p class='muted'>Es único, después podés cambiarlo desde Configuración.</p>"+
   "<div id='st' class='status hide'></div>"+
   "<label for='nom'>Nombre del taller</label><input id='nom' placeholder='SCOTTO Mecánica Náutica'>"+
   "<label for='rub'>Rubro</label><select id='rub'><option value='nautica'>Náutica</option><option value='motos'>Motos</option><option value='autos'>Autos</option></select>"+
   "<div class='btns'><button class='btn' id='cr'>Crear</button></div></div>";
  document.getElementById("cr").onclick=async function(){
   var nom=document.getElementById("nom").value.trim();if(!nom){say("st","Ponele un nombre al taller.",true);return}
   var r=await sb.rpc("crear_taller",{p_nombre:nom,p_rubro:document.getElementById("rub").value});
   if(r.error){say("st",r.error.message,true);return}
   await cargarTalleres();
  };
}

/* ---------------- router ---------------- */
function route(){
  if(S.vista==="panel")renderPanel();
  else if(S.vista==="clientes")renderClientes();
  else if(S.vista==="ordenes")renderOrdenes();
  else if(S.vista==="ordenForm")renderOrdenForm();
  else if(S.vista==="postForm")renderPostForm();
  nv.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-current",b.dataset.v===S.vista||((S.vista==="ordenForm"||S.vista==="postForm")&&b.dataset.v==="ordenes"))});
}

/* ---------------- panel ---------------- */
async function renderPanel(){
  m.innerHTML="<h1>Panel</h1><p class='muted'>"+esc(S.taller.nombre)+"</p><div id='box'>Cargando…</div>";
  var r=await sb.from("ordenes").select("id,numero,estado,clientes(nombre)").order("creado",{ascending:false}).limit(8);
  if(r.error){document.getElementById("box").innerHTML=esc(r.error.message);return}
  var h="<div class='card'><h2>Últimas órdenes</h2>";
  h+=r.data.length?r.data.map(function(o){var cls=o.estado==="Listo"||o.estado==="Entregado"?"g":o.estado==="En reparación"?"w":"";
    return "<div class='lr' style='border-top:1px solid var(--line);padding:8px 0'><span>OT "+String(o.numero).padStart(6,"0")+" · "+esc(o.clientes?o.clientes.nombre:"")+"</span><span class='tag "+cls+"'>"+esc(o.estado)+"</span></div>"}).join(""):"<p class='muted'>Todavía no hay órdenes.</p>";
  h+="</div><div class='btns'><button class='btn' id='ir'>Nueva orden</button></div>";
  document.getElementById("box").outerHTML=h;
  document.getElementById("ir").onclick=function(){S.orden={estado:"Recibido"};S.vista="ordenForm";route()};
}

/* ---------------- clientes / equipos / motores ---------------- */
async function renderClientes(){
  m.innerHTML="<h1>Clientes</h1><div id='box'>Cargando…</div>";
  var r=await sb.from("clientes").select("id,nombre,telefono,equipos(id,nombre,motores(id,marca,modelo,medidor,qr_token))").order("nombre");
  if(r.error){document.getElementById("box").innerHTML=esc(r.error.message);return}
  S.clientes=r.data||[];
  var h="<div class='card'><h2>Nuevo cliente</h2><label for='cn'>Nombre</label><input id='cn'><label for='ct'>Teléfono</label><input id='ct'><div class='btns'><button class='btn' id='ca'>Agregar</button></div></div>";
  h+=S.clientes.map(function(c){
   var eq=(c.equipos||[]).map(function(e){var mot=(e.motores||[]).map(function(mo){return "<div class='lr' style='margin-top:6px'><span class='muted'>"+esc([mo.marca,mo.modelo].filter(Boolean).join(" "))+" · "+medidorLabel().toLowerCase()+": "+esc(mo.medidor||0)+"</span><button class='btn o' data-qr='"+mo.qr_token+"' style='padding:4px 10px;min-height:0'>Ver QR</button></div>"}).join("")||"<span class='muted'>Sin motor cargado.</span>";
    return "<div style='margin-top:8px'><b>"+esc(e.nombre)+"</b>"+mot+"<button class='btn o' data-motor='"+e.id+"' style='margin-top:6px;padding:6px 12px;min-height:0'>+ Motor</button></div>"}).join("")||"<button class='btn o' data-equipo='"+c.id+"'>+ "+equipoLabel()+"</button>";
   return "<div class='card'><b>"+esc(c.nombre)+"</b><br><span class='muted'>"+esc(c.telefono||"")+"</span>"+eq+"<div style='margin-top:8px'><button class='btn o' data-equipo='"+c.id+"' style='padding:6px 12px;min-height:0'>+ "+equipoLabel()+"</button></div></div>"
  }).join("");
  document.getElementById("box").outerHTML=h;
  document.getElementById("ca").onclick=async function(){
   var nom=document.getElementById("cn").value.trim();if(!nom)return;
   await sb.from("clientes").insert({taller_id:S.taller.id,nombre:nom,telefono:document.getElementById("ct").value.trim()});
   renderClientes()};
  m.querySelectorAll("[data-equipo]").forEach(function(b){b.onclick=function(){nuevoEquipo(b.dataset.equipo)}});
  m.querySelectorAll("[data-motor]").forEach(function(b){b.onclick=function(){nuevoMotor(b.dataset.motor)}});
  m.querySelectorAll("[data-qr]").forEach(function(b){b.onclick=function(){verQR(b.dataset.qr)}});
}
async function nuevoEquipo(clienteId){
  var nom=prompt(equipoLabel()+" (nombre):");if(!nom)return;
  await sb.from("equipos").insert({taller_id:S.taller.id,cliente_id:clienteId,nombre:nom});
  renderClientes();
}
async function nuevoMotor(equipoId){
  var marca=prompt("Marca del motor:");if(marca==null)return;
  var modelo=prompt("Modelo / HP:")||"";
  await sb.from("motores").insert({taller_id:S.taller.id,equipo_id:equipoId,marca:marca,modelo:modelo,medidor:0});
  renderClientes();
}
function verQR(token){
  var url=location.origin+location.pathname.replace(/index\.html$/,"")+"historial.html?token="+token;
  var img="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+encodeURIComponent(url);
  m.insertAdjacentHTML("afterbegin","<div class='card qr'><b>Historial digital</b><img src='"+img+"' alt='Código QR'><a class='link' href='"+url+"' target='_blank'>"+url+"</a><button class='btn o' onclick='this.closest(\".card\").remove()'>Cerrar</button></div>");
}

/* ---------------- órdenes: lista ---------------- */
async function renderOrdenes(){
  m.innerHTML="<h1>Órdenes de trabajo</h1><div id='box'>Cargando…</div>";
  var r=await sb.from("ordenes").select("id,numero,estado,clientes(nombre),equipos(nombre)").order("creado",{ascending:false});
  if(r.error){document.getElementById("box").innerHTML=esc(r.error.message);return}
  var h=S.talleres&&S.taller?"":"";
  h+="<div class='btns' style='margin-bottom:12px'><button class='btn' id='nueva'>Nueva orden</button></div>";
  h+=(r.data||[]).map(function(o){var cls=o.estado==="Listo"||o.estado==="Entregado"?"g":o.estado==="En reparación"?"w":"";
   var post=(o.estado==="Listo"||o.estado==="Entregado")?"<button class='btn o' data-post='"+o.id+"' style='padding:6px 12px;min-height:0;margin-top:8px'>📸 Post para Instagram</button>":"";
   return "<div class='card'><button class='item' data-id='"+o.id+"'><span><b>OT "+String(o.numero).padStart(6,"0")+"</b> · "+esc(o.clientes?o.clientes.nombre:"Sin cliente")+"<br><span class='muted'>"+esc(o.equipos?o.equipos.nombre:"")+"</span></span><span class='tag "+cls+"'>"+esc(o.estado)+"</span></button>"+post+"</div>"}).join("")||"<p class='muted'>Sin órdenes todavía.</p>";
  document.getElementById("box").outerHTML=h;
  document.getElementById("nueva").onclick=function(){S.orden={estado:"Recibido"};S.vista="ordenForm";route()};
  m.querySelectorAll("[data-id]").forEach(function(b){b.onclick=async function(){
   var r=await sb.from("ordenes").select("*").eq("id",b.dataset.id).single();
   if(r.error){alert(r.error.message);return}
   S.orden=r.data;S.vista="ordenForm";route()}});
  m.querySelectorAll("[data-post]").forEach(function(b){b.onclick=async function(){
   var r=await sb.from("ordenes").select("*, equipos(nombre), motores(marca,modelo)").eq("id",b.dataset.post).single();
   if(r.error){alert(r.error.message);return}
   S.orden=r.data;S.vista="postForm";route()}});
}

/* ---------------- órdenes: formulario ---------------- */
var ESTADOS=["Recibido","Diagnóstico","Presupuesto","Aprobado","En reparación","Listo","Entregado"];
var rec=null,fotosNuevas=[];
async function renderOrdenForm(){
  fotosNuevas=[];
  var o=S.orden;
  var clientesOpt=(S.clientes.length?S.clientes:(await sb.from("clientes").select("id,nombre")).data||[]);
  var h="<h1>"+(o.id?"OT "+String(o.numero).padStart(6,"0"):"Nueva orden")+"</h1>";
  h+="<div class='big'><button id='dictar'>🎤 Dictar la orden</button><button id='foto'>📷 Foto de datos</button></div>";
  h+="<input type='file' id='file' accept='image/*' capture='environment' class='hide'>";
  h+="<div id='st' class='status hide'></div>";
  h+="<div id='dbox' class='card hide'><h2>Lo que dijiste</h2><textarea id='trans'></textarea><div class='btns'><button class='btn' id='proc'>Completar campos</button><button class='btn o' id='dstop'>Cancelar</button></div></div>";
  h+="<div class='card'>";
  h+="<label for='f_cliente'>Cliente</label><select id='f_cliente'><option value=''>— elegir —</option>"+clientesOpt.map(function(c){return "<option value='"+c.id+"'"+(o.cliente_id===c.id?" selected":"")+">"+esc(c.nombre)+"</option>"}).join("")+"</select>";
  [["equipo_id",equipoLabel()+" (opcional por ahora)"],].forEach(function(){});
  [["motivo","Motivo de ingreso","t"],["diagnostico","Diagnóstico","t"],["trabajos","Trabajos realizados","t"],["repuestos","Repuestos y cantidades","t"],["observaciones","Observaciones","t"]].forEach(function(c){
   h+="<div class='lr'><label for='f_"+c[0]+"'>"+c[1]+"</label><button class='mic' data-mic='"+c[0]+"'>🎤</button></div><textarea id='f_"+c[0]+"'>"+esc(o[c[0]])+"</textarea>"});
  h+="<label for='f_medidor'>"+medidorLabel()+"</label><input id='f_medidor' inputmode='decimal' value='"+esc(o.medidor)+"'>";
  h+="<label for='f_estado'>Estado</label><select id='f_estado'>"+ESTADOS.map(function(e){return "<option"+(e===o.estado?" selected":"")+">"+e+"</option>"}).join("")+"</select></div>";
  h+="<div class='card'><h2>Fotos</h2><div id='ph'>"+(o.id?"<span class='muted'>Cargando fotos…</span>":"<span class='muted'>Se guardan al guardar la orden.</span>")+"</div></div>";
  h+="<div class='btns'><button class='btn' id='save'>Guardar orden</button><button class='btn o' id='back'>Volver</button></div>";
  m.innerHTML=h;
  m.querySelectorAll("[data-mic]").forEach(function(b){b.onclick=function(){micField(b)}});
  document.getElementById("dictar").onclick=startFull;
  document.getElementById("foto").onclick=function(){document.getElementById("file").click()};
  document.getElementById("file").onchange=function(e){if(e.target.files[0])procesarFoto(e.target.files[0]);e.target.value=""};
  document.getElementById("proc").onclick=procesarTexto;
  document.getElementById("dstop").onclick=function(){stopRec();document.getElementById("dbox").classList.add("hide")};
  document.getElementById("save").onclick=guardarOrden;
  document.getElementById("back").onclick=function(){stopRec();S.vista="ordenes";route()};
  if(o.id)cargarFotos(o.id);
}
async function cargarFotos(ordenId){
  var r=await sb.from("fotos").select("id,ruta,resumen").eq("orden_id",ordenId);
  document.getElementById("ph").innerHTML=(r.data&&r.data.length)?r.data.map(function(f){return "<div style='margin-top:6px'><span class='muted'>"+esc(f.resumen||f.ruta)+"</span></div>"}).join(""):"<span class='muted'>Sin fotos.</span>";
}

/* ---- voz ---- */
function stopRec(){if(rec){try{rec.stop()}catch(e){}rec=null}}
function speech(onText,onEnd,cont){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say("st","Este navegador no permite dictar acá. Usá el micrófono del teclado del celular.",true);return null}
  var r=new SR();r.lang="es-AR";r.continuous=!!cont;r.interimResults=true;var fin="";
  r.onresult=function(e){var tmp="";for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript+" ";else tmp+=e.results[i][0].transcript}onText(fin,tmp)};
  r.onerror=function(e){say("st",e.error==="not-allowed"?"El micrófono está bloqueado en el navegador.":"No se pudo dictar ("+e.error+").",true)};
  r.onend=onEnd;try{r.start()}catch(e){return null}return r}
function micField(b){
  if(rec){stopRec();return}
  var el=document.getElementById("f_"+b.dataset.mic),base=el.value?el.value+" ":"";
  b.classList.add("rec");b.textContent="⏹";
  rec=speech(function(f,t){el.value=base+f+t},function(){b.classList.remove("rec");b.textContent="🎤";rec=null},false);
  if(!rec){b.classList.remove("rec");b.textContent="🎤"}}
function startFull(){
  var btn=document.getElementById("dictar"),box=document.getElementById("dbox"),tr=document.getElementById("trans");
  if(rec){stopRec();return}
  box.classList.remove("hide");tr.value="";btn.classList.add("rec");btn.textContent="⏹ Terminar";say("st","Escuchando…");
  rec=speech(function(f,t){tr.value=f+t},function(){btn.classList.remove("rec");btn.textContent="🎤 Dictar la orden";rec=null},true);
  if(!rec){btn.classList.remove("rec");btn.textContent="🎤 Dictar la orden"}}
var CAMPOS_IA="motivo, diagnostico, trabajos, repuestos, observaciones, medidor (solo el número)";
async function procesarTexto(){
  var txt=document.getElementById("trans").value.trim();if(!txt){say("st","Dictá o escribí algo primero.",true);return}
  stopRec();say("st","Completando los campos…");document.getElementById("proc").disabled=true;
  try{
   var resp=await fetch("/api/leer-foto",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({modo:"texto",rubro:S.taller.rubro,texto:txt,campos:CAMPOS_IA})});
   var r=await resp.json();if(r.error)throw r.error;
   Object.keys(r).forEach(function(k){var el=document.getElementById("f_"+k);if(el&&r[k]!=null)el.value=r[k]});
   document.getElementById("dbox").classList.add("hide");say("st","Listo. Revisá los campos.")
  }catch(e){say("st","No se pudo procesar. Cargá los campos a mano.",true)}
  document.getElementById("proc").disabled=false}
function shrink(file){return new Promise(function(res){var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var s=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){res(b)},"image/jpeg",.82)};img.src=u})}
async function procesarFoto(file){
  say("st","Preparando la foto…");
  var blob=await shrink(file);
  fotosNuevas.push(blob);
  document.getElementById("ph").insertAdjacentHTML("beforeend","<div class='muted'>Foto agregada, se sube al guardar.</div>");
  say("st","Leyendo los datos de la foto…");
  var b64=await new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(fr.result.split(",")[1])};fr.readAsDataURL(blob)});
  try{
   var resp=await fetch("/api/leer-foto",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({modo:"foto",rubro:S.taller.rubro,imagen:b64})});
   var r=await resp.json();if(r.error)throw r.error;
   if(r.campos)Object.keys(r.campos).forEach(function(k){var el=document.getElementById("f_"+k);if(el&&r.campos[k]!=null&&!el.value)el.value=r.campos[k]});
   say("st","Foto procesada: "+(r.resumen||""))
  }catch(e){say("st","La foto se guardó, pero no se pudo leer automáticamente.",true)}
}
async function guardarOrden(){
  var o=S.orden,data={
   taller_id:S.taller.id,
   cliente_id:document.getElementById("f_cliente").value||null,
   motivo:document.getElementById("f_motivo").value,
   diagnostico:document.getElementById("f_diagnostico").value,
   trabajos:document.getElementById("f_trabajos").value,
   repuestos:document.getElementById("f_repuestos").value,
   observaciones:document.getElementById("f_observaciones").value,
   medidor:Number(document.getElementById("f_medidor").value)||null,
   estado:document.getElementById("f_estado").value
  };
  var ordenId=o.id,res;
  if(ordenId)res=await sb.from("ordenes").update(data).eq("id",ordenId).select().single();
  else res=await sb.from("ordenes").insert(data).select().single();
  if(res.error){say("st",res.error.message,true);return}
  ordenId=res.data.id;
  for(var i=0;i<fotosNuevas.length;i++){
   var path=S.taller.id+"/"+ordenId+"/"+Date.now()+"_"+i+".jpg";
   var up=await sb.storage.from("fotos").upload(path,fotosNuevas[i]);
   if(!up.error)await sb.from("fotos").insert({taller_id:S.taller.id,orden_id:ordenId,ruta:path});
  }
  S.vista="ordenes";route();
}

/* ---------------- post para Instagram ---------------- */
var postFotos=[],postSel={};
async function renderPostForm(){
  var o=S.orden;
  m.innerHTML="<h1>Post para Instagram</h1><p class='muted'>OT "+String(o.numero).padStart(6,"0")+" · "+esc(o.equipos?o.equipos.nombre:"")+"</p>"+
   "<div id='st' class='status hide'></div>"+
   "<div class='card'><h2>1. Elegí las fotos</h2><div id='fotos'>Cargando fotos…</div></div>"+
   "<div class='card'><h2>2. Estilo del texto</h2><select id='tono'><option value='profesional'>Profesional y técnico</option><option value='cercano'>Cercano, informal, con humor</option></select>"+
   "<div class='btns'><button class='btn' id='gen'>Generar texto</button></div></div>"+
   "<div id='variantes'></div>"+
   "<div class='btns'><button class='btn o' id='back'>Volver</button></div>";
  document.getElementById("back").onclick=function(){S.vista="ordenes";route()};
  document.getElementById("gen").onclick=generarPost;
  postFotos=[];postSel={};
  var r=await sb.from("fotos").select("id,ruta,resumen").eq("orden_id",o.id);
  if(r.error||!r.data||!r.data.length){document.getElementById("fotos").innerHTML="<p class='muted'>Esta orden no tiene fotos cargadas. Podés generar el texto igual.</p>";return}
  postFotos=r.data;
  var h="<div style='display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px'>";
  for(var i=0;i<postFotos.length;i++){
   var f=postFotos[i],sig=await sb.storage.from("fotos").createSignedUrl(f.ruta,600);
   var url=sig.data?sig.data.signedUrl:"";postSel[f.id]=true;
   h+="<label style='display:block;font-weight:400;margin:0'><img src='"+url+"' style='width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px' alt='Foto del trabajo'>"+
      "<span class='lr' style='margin-top:4px'><input type='checkbox' data-fid='"+f.id+"' checked style='width:auto;min-height:0'> <span class='muted' style='font-size:.82rem'>"+esc(f.resumen||"Incluir")+"</span></span></label>";
  }
  h+="</div>";
  document.getElementById("fotos").innerHTML=h;
  document.querySelectorAll("[data-fid]").forEach(function(c){c.onchange=function(){postSel[c.dataset.fid]=c.checked}});
}
async function generarPost(){
  var o=S.orden;say("st","Escribiendo el texto…");document.getElementById("gen").disabled=true;
  var resumenes=postFotos.filter(function(f){return postSel[f.id]}).map(function(f){return f.resumen}).filter(Boolean);
  try{
   var resp=await fetch("/api/generar-post",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    rubro:S.taller.rubro,
    equipo:o.equipos?o.equipos.nombre:"",
    motor:o.motores?[o.motores.marca,o.motores.modelo].filter(Boolean).join(" "):"",
    trabajos:o.trabajos,
    resumenesFotos:resumenes,
    tono:document.getElementById("tono").value
   })});
   var r=await resp.json();if(r.error)throw r.error;
   document.getElementById("variantes").innerHTML=(r.variantes||[]).map(function(v,i){return "<div class='card'><h2>Opción "+(i+1)+"</h2><textarea data-v='"+i+"' style='min-height:140px'>"+esc(v.texto)+"</textarea><div class='btns'><button class='btn o' data-copy='"+i+"'>Copiar texto</button></div></div>"}).join("");
   document.getElementById("variantes").querySelectorAll("[data-copy]").forEach(function(b){b.onclick=function(){
    var ta=document.querySelector("[data-v='"+b.dataset.copy+"']");ta.select();document.execCommand?document.execCommand("copy"):navigator.clipboard.writeText(ta.value);
    b.textContent="¡Copiado!";setTimeout(function(){b.textContent="Copiar texto"},1500)}});
   say("st","Listo. Copiá el texto que más te guste, y las fotos marcadas arriba las guardás desde el celular para subirlas junto con el texto.")
  }catch(e){say("st","No se pudo generar el texto. Probá de nuevo.",true)}
  document.getElementById("gen").disabled=false;
}

boot();
