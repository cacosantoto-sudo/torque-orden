<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libro de mantenimiento digital</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2ef;--card:#fff;--ink:#141414;--mute:#6b6b66;--line:#e2e2dc;--ac:#e85a06;--ok:#16924c;--w:#b7791f;--bad:#d33a2f;--soft:#f7f7f4}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#151515;--ink:#f3f3f1;--mute:#9a9a94;--line:#2a2a2a;--ac:#ff6a13;--ok:#3ecf7a;--w:#ffb020;--bad:#ff5a4f;--soft:#1c1c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,sans-serif;padding:0 0 40px}
main{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:"Barlow Condensed","Barlow",sans-serif;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.1rem;font-weight:700;letter-spacing:.07em;display:flex;align-items:center;gap:8px;margin-bottom:10px}
h2::before{content:"";width:4px;height:1em;background:var(--ac);border-radius:2px}
.top{background:#0a0a0a;color:#fff;padding:22px 16px 18px;text-align:center;border-bottom:3px solid var(--ac)}
.top img{max-width:120px;max-height:80px;border-radius:10px;background:#fff;padding:6px}
.top b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.5rem;letter-spacing:.04em;text-transform:uppercase;margin-top:8px}
.top span{color:#bbb;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.muted{color:var(--mute)}
.veh{margin-top:18px}
.plate{display:inline-flex;flex-direction:column;background:#fff;color:#111;border:2px solid #111;border-radius:6px;overflow:hidden;font-family:"JetBrains Mono",monospace;font-weight:600;line-height:1;margin-top:10px}
.plate::before{content:"ARGENTINA";background:#1d3fa6;color:#fff;font:700 .5rem/1.5 "Barlow",sans-serif;letter-spacing:.2em;text-align:center}
.plate span{padding:4px 10px 5px;letter-spacing:.12em;font-size:1.25rem}
.fila{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:7px 0}
.fila:first-of-type{border-top:0}
.fila b{text-align:right}
.prox{display:grid;gap:10px}
.px{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:10px 12px;background:var(--soft)}
.px.w{border-left-color:var(--w)}.px.bad{border-left-color:var(--bad)}
.px h3{font-size:1.15rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.px .k{font-family:"JetBrains Mono",monospace;font-size:1.05rem;font-weight:600}
.tag{font:600 .7rem/1 "JetBrains Mono",monospace;letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.tag.g{color:var(--ok)}.tag.w{color:var(--w)}.tag.bad{color:var(--bad)}.tag.n{color:var(--mute)}
.ev{border-top:1px solid var(--line);padding:12px 0}
.ev:first-of-type{border-top:0;padding-top:2px}
.ev .cab{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ev .cab b{font-family:"Barlow Condensed",sans-serif;font-size:1.1rem;text-transform:uppercase;letter-spacing:.03em}
.ev ul{margin:6px 0 0;padding-left:18px}.ev li{margin:2px 0}
.mono{font-family:"JetBrains Mono",monospace;font-size:.92rem}
.tabla{width:100%;border-collapse:collapse;font-size:.92rem}.tabla td,.tabla th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}.tabla th{font-weight:600;color:var(--mute);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ok)}
.bar.w i{background:var(--w)}.bar.bad i{background:var(--bad)}
.contacto a{color:var(--ac);font-weight:600;text-decoration:none}
nav.idx{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
nav.idx a{font:600 .8rem/1 "Barlow",sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px}
.pie{text-align:center;color:var(--mute);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<div id="m"><main><p style="padding-top:40px">Cargando…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var CFG=window.SCOTTO_CONFIG;
var sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var NAUT=false;
function km(n){return n==null||n===""?"":Number(n).toLocaleString("es-AR")+(NAUT?" h":" km")}
function fecha(f){if(!f)return "";var d=String(f).length===10?new Date(f+"T12:00:00"):new Date(f);return isNaN(d)?String(f):d.toLocaleDateString("es-AR")}
function mesAnio(f){if(!f)return "";var t=new Date(String(f).slice(0,10)+"T12:00:00").toLocaleDateString("es-AR",{month:"long",year:"numeric"});return t.charAt(0).toUpperCase()+t.slice(1)}
function money(n){n=Number(n)||0;return "$"+n.toLocaleString("es-AR",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function hoy(){var d=new Date();d.setHours(12,0,0,0);return d}
var TIPOS={aceite:["🛢️","Aceite de motor","Service de aceite y filtros"],caja:["⚙️","Aceite caja automática","Service de caja automática"],distribucion:["🔧","Distribución","Distribución"],otro:["🧰","Otro","Mantenimiento"]};
function fila(a,b){return b==null||b===""?"":"<div class='fila'><span class='muted'>"+a+"</span><b>"+esc(b)+"</b></div>"}
function estado(p,kmAct){
  var dias=p.proximo_fecha?Math.round((new Date(p.proximo_fecha+"T12:00:00")-hoy())/864e5):null,falta=p.proximo_km&&kmAct?p.proximo_km-kmAct:null;
  if((dias!=null&&dias<0)||(falta!=null&&falta<=0))return ["bad","Vencido"];
  if((dias!=null&&dias<=30)||(falta!=null&&falta<=1000))return ["w","Por vencer"];
  return ["g","Al día"];
}
function detalle(x){
  var d=x.datos||{},L=[];
  if(x.tipo==="aceite"){
   var ac=[d.aceite_marca,d.aceite_tipo].filter(Boolean).join(" ");
   if(ac)L.push(["Aceite",ac]);if(d.viscosidad)L.push(["Viscosidad",d.viscosidad]);if(d.litros)L.push(["Cantidad",String(d.litros).replace(".",",")+" litros"]);
   [["filtro_aceite","Filtro de aceite"],["filtro_aire","Filtro de aire"],["filtro_habitaculo","Filtro de habitáculo"],["filtro_combustible","Filtro de combustible"]].forEach(function(f){L.push([f[1],d[f[0]]?"✔ "+d[f[0]]:"—"])});
  }else if(x.tipo==="caja"){if(d.atf)L.push(["Aceite ATF",d.atf]);if(d.litros)L.push(["Cantidad",String(d.litros).replace(".",",")+" litros"]);L.push(["Filtro reemplazado",d.filtro?"✔ "+d.filtro:"No"])}
  else if(x.tipo==="distribucion"){var c=(d.componentes||[]).concat(d.otros?[d.otros]:[]);if(c.length)L.push(["Componentes reemplazados",c.join(", ")])}
  else if(d.descripcion)L.push(["Trabajo",d.descripcion]);
  if(x.proximo_km)L.push(["Próximo service",km(x.proximo_km)]);
  if(x.proximo_fecha)L.push(["Fecha límite",fecha(x.proximo_fecha)]);
  if(x.observaciones)L.push(["Observaciones",x.observaciones]);
  return L;
}
(async function(){
  var q=new URLSearchParams(location.search),token=q.get("t")||q.get("token");
  var M=document.getElementById("m");
  if(!token){M.innerHTML="<main><p style='padding-top:40px'>Falta el código del QR.</p></main>";return}
  var r=await sb.rpc("ficha_publica",{p_token:token});
  if(r.error||!r.data){M.innerHTML="<main><p style='padding-top:40px'>No encontramos la ficha de este vehículo.</p></main>";return}
  var d=r.data,t=d.taller||{},v=d.vehiculo||{},kmAct=d.km_actual;
  NAUT=t.rubro==="nautica";
  var titulo=v.nombre||[v.marca,v.modelo].filter(Boolean).join(" ")||"Vehículo";
  document.title=titulo+" · Libro de mantenimiento";
  var h="<div class='top'>"+(t.logo?"<img src='"+esc(t.logo)+"' alt=''>":"")+"<b>"+esc(t.nombre)+"</b><span>Libro de mantenimiento digital</span></div><main>";
  h+="<div class='veh'><h1>"+esc(titulo)+"</h1><div class='muted'>"+esc([v.nombre&&v.marca&&v.nombre.toLowerCase()!==[v.marca,v.modelo].filter(Boolean).join(" ").toLowerCase()?[v.marca,v.modelo].filter(Boolean).join(" "):"",v.anio,v.color].filter(Boolean).join(" · "))+"</div>"+(v.patente?"<div class='plate'><span>"+esc(v.patente)+"</span></div>":"")+"</div>"+"%%NAV%%";
  var secciones=[];
  // próximos
  var ultimo={};(d.mantenimientos||[]).forEach(function(x){if(x.tipo!=="otro"&&!ultimo[x.tipo])ultimo[x.tipo]=x});
  var prox=["aceite","caja","distribucion"].filter(function(k){return ultimo[k]&&(ultimo[k].proximo_km||ultimo[k].proximo_fecha)});
  if(prox.length){secciones.push(["proximos","Próximos"]);
   h+="<div class='card' id='proximos'><h2>Próximos servicios</h2><div class='prox'>"+prox.map(function(k){var p=ultimo[k],e=estado(p,kmAct);
    return "<div class='px "+e[0]+"'><h3><span>"+TIPOS[k][0]+" "+TIPOS[k][1]+"</span><span class='tag "+e[0]+"'>"+e[1]+"</span></h3>"+
     (p.proximo_km?"<div>Próximo: <span class='k'>"+km(p.proximo_km)+"</span></div>":"")+(p.proximo_fecha?"<div>Fecha límite: <b>"+mesAnio(p.proximo_fecha)+"</b> <span class='muted'>("+fecha(p.proximo_fecha)+")</span></div>":"")+"</div>"}).join("")+"</div>"+
    (kmAct?"<p class='muted' style='margin:10px 0 0;font-size:.9rem'>Último "+(NAUT?"registro de horas":"kilometraje registrado")+": "+km(kmAct)+"</p>":"")+"</div>";
  }
  // datos
  secciones.push(["datos","Vehículo"]);
  h+="<div class='card' id='datos'><h2>Datos del vehículo</h2>"+fila("Marca",v.marca)+fila("Modelo",v.modelo)+fila("Año",v.anio)+fila("Color",v.color)+fila(NAUT?"Matrícula":"Patente",v.patente)+"</div>";
  var mot=fila("Motor",v.motor)+fila("Cilindrada",v.cilindrada)+fila("Combustible",v.combustible)+fila("Código de motor",v.codigo_motor)+(d.motores||[]).map(function(mo){return fila("Motor",[mo.marca,mo.modelo].filter(Boolean).join(" "))}).join("");
  var caja=fila("Tipo de caja",v.caja_tipo==="automatica"?"Automática":v.caja_tipo==="manual"?"Manual":v.caja_tipo)+fila("Modelo / código de caja",v.caja_modelo);
  if(mot||caja)h+="<div class='card'><h2>Motor y transmisión</h2>"+mot+caja+"</div>";
  // services
  var mants=d.mantenimientos||[];
  if(mants.length){secciones.push(["services","Services"]);
   h+="<div class='card' id='services'><h2>Historial de services</h2>"+mants.map(function(x){var T=TIPOS[x.tipo]||TIPOS.otro;
    return "<div class='ev'><div class='cab'><b>"+T[0]+" "+T[2]+"</b><span class='mono'>"+fecha(x.fecha)+"</span></div>"+(x.km?"<div class='muted'>"+km(x.km)+"</div>":"")+
     detalle(x).map(function(l){return "<div class='fila' style='font-size:.93rem'><span class='muted'>"+l[0]+"</span><b style='font-weight:600'>"+esc(l[1])+"</b></div>"}).join("")+"</div>"}).join("")+"</div>";
  }
  // reparaciones
  var vis=d.visitas||[],hechas=vis.filter(function(o){return o.estado==="Listo"||o.estado==="Entregado"});
  if(hechas.length){secciones.push(["reparaciones","Reparaciones"]);
   h+="<div class='card' id='reparaciones'><h2>Reparaciones realizadas</h2>"+hechas.map(function(o){
    return "<div class='ev'><div class='cab'><b>OT "+String(o.numero).padStart(6,"0")+"</b><span class='mono'>"+fecha(o.fecha)+"</span></div>"+(o.km?"<div class='muted'>"+km(o.km)+"</div>":"")+
     "<div style='white-space:pre-wrap'>"+esc(o.trabajos||o.motivo||"Sin detalle")+"</div></div>"}).join("")+"</div>";
  }
  // presupuestos
  var pres=d.presupuestos||[];
  if(pres.length){secciones.push(["presupuestos","Presupuestos"]);
   var colEst={"Aprobado":"g","Realizado":"g","Parcialmente aprobado":"w","Pendiente":"n","Rechazado":"bad"};
   h+="<div class='card' id='presupuestos'><h2>Presupuestos</h2>"+pres.map(function(p){
    return "<div class='ev'><div class='cab'><b>N° "+String(p.numero).padStart(6,"0")+"</b><span class='tag "+(colEst[p.estado]||"n")+"'>"+esc(p.estado||"Pendiente")+"</span></div><div class='muted'>"+fecha(p.fecha)+"</div>"+
     (p.items&&p.items.length?"<ul>"+p.items.map(function(it){return "<li>"+esc(it)+"</li>"}).join("")+"</ul>":"")+"<div style='margin-top:6px'>Total: <b>"+money(p.total)+"</b></div></div>"}).join("")+"</div>";
  }
  // neumáticos
  var neu=d.neumaticos||[];
  if(neu.length){secciones.push(["neumaticos","Neumáticos"]);
   var act={};neu.forEach(function(n){if(!act[n.posicion])act[n.posicion]=n});
   h+="<div class='card' id='neumaticos'><h2>Neumáticos</h2>"+Object.keys(act).map(function(k){var n=act[k],vida=n.vida_pct,cl=vida==null?"":vida<=15?"bad":vida<=30?"w":"";
     return "<div class='ev'><div class='cab'><b>"+esc(k)+"</b><span class='muted'>"+esc([n.marca,n.modelo].filter(Boolean).join(" "))+"</span></div>"+(n.medida?"<div class='mono'>"+esc(n.medida)+"</div>":"")+
      (vida!=null?"<div style='font-size:.9rem'>Vida útil estimada: <b>"+vida+"%</b>"+(cl==="bad"?" · <b style='color:var(--bad)'>Reemplazar</b>":cl==="w"?" · <b style='color:var(--w)'>Cambiar pronto</b>":"")+"</div><div class='bar "+cl+"'><i style='width:"+Math.max(0,Math.min(100,vida))+"%'></i></div>":"")+
      "<div class='muted' style='font-size:.85rem;margin-top:4px'>Control: "+fecha(n.fecha)+(n.km?" · "+km(n.km):"")+"</div></div>"}).join("")+
    "<details style='margin-top:8px'><summary class='muted'>Historial de neumáticos ("+neu.length+")</summary><table class='tabla'><tr><th>Fecha</th><th>Pos.</th><th>Detalle</th></tr>"+neu.map(function(n){
     return "<tr><td>"+fecha(n.fecha)+"</td><td>"+esc(n.posicion)+"</td><td>"+esc([n.evento==="colocacion"?"Colocación":"Control",n.marca,n.medida,n.vida_pct!=null?n.vida_pct+"%":"",n.km?km(n.km):"",n.observaciones].filter(Boolean).join(" · "))+"</td></tr>"}).join("")+"</table></details></div>";
  }
  // alineaciones
  var ali=d.alineaciones||[];
  if(ali.length){secciones.push(["alineaciones","Alineaciones"]);
   var ETQ={del_caida_izq:"Caída del. izq.",del_caida_der:"Caída del. der.",del_conv:"Convergencia del.",del_avance_izq:"Avance izq.",del_avance_der:"Avance der.",tra_caida_izq:"Caída tras. izq.",tra_caida_der:"Caída tras. der.",tra_conv:"Convergencia tras."};
   h+="<div class='card' id='alineaciones'><h2>Alineaciones</h2>"+ali.map(function(a){var vals=a.valores||{};
    return "<div class='ev'><div class='cab'><b>Alineación</b><span class='mono'>"+fecha(a.fecha)+"</span></div>"+(a.km?"<div class='muted'>"+km(a.km)+"</div>":"")+
     Object.keys(ETQ).filter(function(k){return vals[k]!=null&&vals[k]!==""}).map(function(k){return fila(ETQ[k],vals[k])}).join("")+(a.observaciones?"<div style='margin-top:4px'>"+esc(a.observaciones)+"</div>":"")+"</div>"}).join("")+"</div>";
  }
  // kilometraje por visita
  var kms=[];vis.forEach(function(o){if(o.km)kms.push([o.fecha,o.km,"OT "+String(o.numero).padStart(6,"0")])});mants.forEach(function(x){if(x.km)kms.push([x.fecha,x.km,(TIPOS[x.tipo]||TIPOS.otro)[2]])});
  if(kms.length){secciones.push(["km",NAUT?"Horas":"Kilometraje"]);
   kms.sort(function(a,b){return String(b[0]).localeCompare(String(a[0]))});
   h+="<div class='card' id='km'><h2>"+(NAUT?"Horas registradas":"Kilometraje en cada visita")+"</h2><table class='tabla'><tr><th>Fecha</th><th>"+(NAUT?"Horas":"Km")+"</th><th>Visita</th></tr>"+kms.map(function(k){return "<tr><td>"+fecha(k[0])+"</td><td class='mono'>"+km(k[1])+"</td><td>"+esc(k[2])+"</td></tr>"}).join("")+"</table></div>";
  }
  if(!mants.length&&!hechas.length)h+="<div class='card'><p class='muted' style='margin:0'>Todavía no hay services registrados para este vehículo.</p></div>";
  // contacto
  var c=[];
  if(t.telefono)c.push("📞 <a href='tel:"+esc(String(t.telefono).replace(/[^0-9+]/g,""))+"'>"+esc(t.telefono)+"</a>");
  if(t.direccion)c.push("📍 "+esc(t.direccion)+(t.maps_url?" · <a href='"+esc(t.maps_url)+"' target='_blank' rel='noopener'>Cómo llegar</a>":""));
  if(t.instagram)c.push("📷 <a href='https://instagram.com/"+esc(String(t.instagram).replace(/^@/,""))+"' target='_blank' rel='noopener'>@"+esc(String(t.instagram).replace(/^@/,""))+"</a>");
  if(c.length)h+="<div class='card contacto'><h2>"+esc(t.nombre)+"</h2>"+c.join("<br>")+"</div>";
  h+="<p class='pie'>Libro de mantenimiento digital · Torque &amp; Orden</p></main>";
  h=h.replace("%%NAV%%",secciones.length>2?"<nav class='idx'>"+secciones.map(function(s){return "<a href='#"+s[0]+"'>"+s[1]+"</a>"}).join("")+"</nav>":"");
  M.innerHTML=h;
})();
</script>
</body>
</html>
