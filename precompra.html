<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe de verificación pre compra</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2ef;--card:#fff;--ink:#141414;--mute:#6b6b66;--line:#e2e2dc;--ac:#d71920;--ok:#2ea043;--w:#c98a00;--bad:#d71920;--soft:#f6f6f3}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#151515;--ink:#f3f3f1;--mute:#9a9a94;--line:#2a2a2a;--ac:#ff4a4f;--ok:#3ecf7a;--w:#ffb020;--bad:#ff5a4f;--soft:#1c1c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,sans-serif;padding:0 0 40px}
main{max-width:720px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:"Barlow Condensed","Barlow",sans-serif;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0}
h2{font-size:1.15rem;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;gap:8px;margin-bottom:10px}
h2::before{content:"";width:4px;height:1em;background:var(--ac);border-radius:2px}
.top{background:#121212;color:#fff;padding:20px 16px 18px;text-align:center;border-bottom:4px solid #d71920}
.top img{max-width:170px;max-height:90px}.top img.logo-claro{background:#fff;border-radius:6px;padding:4px}
.top .t1{display:block;font-size:.85rem;letter-spacing:.14em;color:#ccc;margin-top:10px;text-transform:uppercase}
.top .t2{display:block;font:italic 800 1.9rem/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase}.top .t2 span{color:#ff3b41}
.top .cod{display:inline-block;margin-top:10px;border:1px solid #555;border-radius:8px;padding:4px 12px;font:600 .9rem "JetBrains Mono",monospace}.top .cod b{color:#ff3b41}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.muted{color:var(--mute)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
.datos div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:6px 0;font-size:.95rem}.datos div span:first-child{color:var(--mute);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.datos div span:last-child{font-weight:600;text-align:right}
.foto{width:100%;border-radius:10px;display:block;object-fit:cover;background:var(--soft)}
.score{display:flex;gap:16px;align-items:center}
.score .tag{display:inline-block;color:#fff;border-radius:6px;padding:4px 10px;font:700 1rem "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase}
.cat{border-top:1px solid var(--line);padding:10px 0}.cat .lr{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;border-radius:4px}
.alerta{display:flex;gap:8px;padding:4px 0}.alerta::before{content:"!";flex:none;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font:700 .75rem/18px sans-serif;text-align:center;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.75rem;text-transform:uppercase;color:var(--mute);letter-spacing:.04em}
td.n,th.n{text-align:right;font-family:"JetBrains Mono",monospace}
.ok{color:var(--ok);font-weight:600}.w{color:var(--w);font-weight:600}.bad{color:var(--bad);font-weight:600}
.neus{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.neus .foto{aspect-ratio:16/9}
.chk div{padding:3px 0}.chk div::before{content:"✓";display:inline-block;width:18px;color:var(--ok);font-weight:700}.chk div.no::before{content:"✕";color:var(--bad)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.gal a{display:block}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:700 1.05rem "Barlow Condensed",sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;min-height:48px;text-decoration:none}
.btn:disabled{opacity:.6}
.recom{font:800 1.5rem/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase}
a.link{color:var(--ac);font-weight:600;text-decoration:none}
footer{text-align:center;color:var(--mute);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<div class="top" id="top"><span class="t1">Cargando el informe…</span></div>
<main id="m"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="js/logo.js"></script>
<script src="js/precompra-pdf.js"></script>
<script>
var CFG=window.SCOTTO_CONFIG;
var sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function urlWeb(u){u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:""}
function cls(ok){return ok?"ok":"bad"}
(async function(){
  var token=new URLSearchParams(location.search).get("t"),m=document.getElementById("m"),top=document.getElementById("top");
  if(!token){top.innerHTML="<span class='t1'>Falta el código del QR.</span>";return}
  var r=await sb.rpc("precompra_publica",{p_token:token});
  if(r.error||!r.data){top.innerHTML="<span class='t1'>No se encontró el informe.</span>";return}
  var T=r.data.taller||{},K=r.data.config||{},P=r.data.informe||{},D=P.datos||{},F=P.fotos||{},tot=pcTotal(D),cal=pcCalif(tot,K),riesgo=pcRiesgo(D,tot),recom=pcRecom(D,tot);
  document.title="Informe pre compra "+(P.codigo||"")+" · "+(T.nombre||"");
  top.innerHTML=(T.logo?"<img src=\""+esc(T.logo)+"\" alt='"+esc(T.nombre)+"' data-recortar><br>":"<b style='font:800 1.6rem \"Barlow Condensed\"'>"+esc(T.nombre)+"</b>")+
   "<span class='t1'>Informe de verificación</span><span class='t2'>Precompra <span>Premium</span></span>"+
   "<span class='cod'>N° <b>"+esc(P.codigo)+"</b> · "+esc(pcFecha(P.fecha).replace(/ /g,""))+"</span>";
  recortarImagenes(top);
  var h="";
  // vehículo
  var filas=[["Marca / modelo",[P.marca,P.modelo].filter(Boolean).join(" ")],["Año",P.anio],["Dominio",P.patente],["Kilometraje",P.km!=null?Number(P.km).toLocaleString("es-AR")+" km":""],["Motor",P.motor],["Combustible",P.combustible],["Transmisión",P.transmision],["Color",P.color],["N° de chasis (VIN)",P.vin],["Cliente",P.cliente&&P.cliente.nombre],["Lugar de inspección",P.lugar]];
  h+="<div class='card'><h2>Datos del vehículo</h2><div class='g2'><div>"+(F.principal?"<a href=\""+esc(pcUrlFoto(F.principal))+"\" target='_blank' rel='noopener'><img class='foto' style='aspect-ratio:4/3' src=\""+esc(pcUrlFoto(F.principal))+"\" alt='Foto del vehículo'></a>":"")+"</div><div class='datos'>"+
   filas.filter(function(f){return f[1]!=null&&String(f[1]).trim()}).map(function(f){return "<div><span>"+f[0]+"</span><span>"+esc(f[1])+"</span></div>"}).join("")+"</div></div></div>";
  // puntaje
  var C=2*Math.PI*42,col=pcRgb(cal.col);
  h+="<div class='card'><h2>Puntaje general del vehículo</h2><div class='score'><svg width='110' height='110' style='flex:none' viewBox='0 0 100 100' role='img' aria-label='"+tot+" de 100'><circle cx='50' cy='50' r='42' fill='none' stroke='var(--soft)' stroke-width='9'/>"+
   "<circle cx='50' cy='50' r='42' fill='none' stroke='"+col+"' stroke-width='9' stroke-linecap='round' stroke-dasharray='"+(C*tot/100)+" "+C+"' transform='rotate(-90 50 50)'/><text x='50' y='54' text-anchor='middle' font-size='28' font-weight='800' fill='currentColor' font-family='Barlow Condensed'>"+tot+"</text><text x='50' y='70' text-anchor='middle' font-size='10' fill='currentColor'>/100</text></svg>"+
   "<div><span class='tag' style='background:"+col+"'>"+esc(cal.txt)+"</span>"+(D.resumen?"<p style='margin:10px 0 0'>"+esc(D.resumen)+"</p>":"")+"</div></div></div>";
  // categorías
  h+="<div class='card'><h2>Puntuación por categorías</h2>"+PC_CATS.map(function(c,i){var p=pcPuntos(D,c.k),pc=p/c.max;
   return "<div class='cat'><div class='lr'><b>"+(i+1)+". "+c.n+"</b><span style='font:700 1.2rem \"Barlow Condensed\";color:"+pcRgb(pcColPct(pc))+"'>"+p+"/"+c.max+"</span></div><div class='bar'><i style='width:"+Math.round(pc*100)+"%;background:"+pcRgb(pcColPct(pc))+"'></i></div><span class='muted' style='font-size:.92rem'>"+esc(pcComentario(D,c.k))+"</span></div>"}).join("")+"</div>";
  // alertas
  var al=(D.alertas||[]).filter(function(a){return String(a||"").trim()});
  if(al.length)h+="<div class='card' style='border-color:var(--bad)'><h2>Alertas importantes</h2>"+al.map(function(a){return "<div class='alerta'>"+esc(a)+"</div>"}).join("")+"</div>";
  // carrocería
  h+="<div class='card'><h2>Carrocería y pintura</h2><div style='display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap'><div>"+pcCarroSvg(D,110)+"</div><div style='flex:1;min-width:240px'><table><tr><th>Sector</th><th>Estado</th><th class='n'>µm</th></tr>"+
   PC_SECTORES.map(function(s){var d=pcSecDe(D,s[0]),e=pcEstado(d.estado);return "<tr><td>"+s[1]+(d.obs?"<br><span class='muted' style='font-size:.82rem'>"+esc(d.obs)+"</span>":"")+"</td><td class='"+(d.estado?(d.estado==="original"?"ok":d.estado==="repintado"?"w":"bad"):"muted")+"'>"+(d.estado?e[1]:"-")+"</td><td class='n'>"+esc(d.um||"-")+"</td></tr>"}).join("")+
   "</table><p class='muted' style='font-size:.8rem'>Espesores medidos con medidor de pintura digital.</p></div></div></div>";
  // neumáticos
  h+="<div class='card'><h2>Neumáticos</h2><div class='neus'>"+PC_NEU.map(function(n){var d=pcNeuDe(D,n[0]),u=pcUrlFoto(F["neu_"+n[0]]),v=String(d.vida||"").trim();
   return "<div>"+(u?"<a href=\""+esc(u)+"\" target='_blank' rel='noopener'><img class='foto' src=\""+esc(u)+"\" alt='"+n[1]+"'></a>":"")+"<b>"+n[1]+"</b><br><span class='muted' style='font-size:.9rem'>DOT: "+esc(d.dot||"-")+" · "+esc(d.mm?String(d.mm).replace(".",",")+" mm":"- mm")+"</span>"+
    (v?"<div class='bar'><i style='width:"+Math.min(100,pcNum(v))+"%;background:"+pcRgb(pcColPct(pcNum(v)/100))+"'></i></div><span style='font-size:.9rem'>"+pcNum(v)+"% de vida útil</span>":"")+"</div>"}).join("")+"</div></div>";
  // submódulos
  var Fr=D.frenos||{},E=D.escaneo||{},Mj=D.manejo||{},In=D.interior||{};
  function sub(tit,foto,cuerpo){var u=pcUrlFoto(F[foto]);return "<div class='card'><h2>"+tit+"</h2>"+(u?"<a href=\""+esc(u)+"\" target='_blank' rel='noopener'><img class='foto' style='aspect-ratio:16/9;margin-bottom:8px' src=\""+esc(u)+"\" alt=''></a>":"")+cuerpo+"</div>"}
  h+="<div class='g2'>"+
   sub("Frenos","frenos","<div class='datos'><div><span>Pastillas delanteras</span><span>"+(Fr.pd?pcNum(Fr.pd)+"%":"-")+"</span></div><div><span>Discos delanteros</span><span>"+esc(Fr.dd||"-")+"</span></div><div><span>Pastillas traseras</span><span>"+(Fr.pt?pcNum(Fr.pt)+"%":"-")+"</span></div><div><span>Discos traseros</span><span>"+esc(Fr.dt||"-")+"</span></div></div>"+
    (Fr.parejo!=null?"<div class='chk'><div class='"+(Fr.parejo?"":"no")+"'>"+(Fr.parejo?"Frenado parejo y eficiente":"Frenado a revisar")+"</div></div>":""))+
   sub("Escaneo electrónico","escaneo","<p style='margin:0 0 6px'>"+esc(E.fallas||"Sin fallas activas.")+"</p><div class='chk'>"+PC_ESCANEO.filter(function(x){return E[x[0]]!=null}).map(function(x){return "<div class='"+(E[x[0]]?"":"no")+"'>"+x[1]+(E[x[0]]?" OK":" con falla")+"</div>"}).join("")+"</div>")+
   sub("Prueba de manejo","manejo","<div class='chk'>"+PC_MANEJO.filter(function(x){return String(Mj[x[0]]||"").trim()}).map(function(x){return "<div class='"+(pcOk(Mj[x[0]],x[0])?"":"no")+"'>"+x[1]+": "+esc(Mj[x[0]])+"</div>"}).join("")+"</div>")+
   sub("Interior","interior","<div class='chk'>"+PC_INTERIOR.filter(function(x){return String(In[x[0]]||"").trim()}).map(function(x){return "<div class='"+(pcOk(In[x[0]],x[0])?"":"no")+"'>"+x[1]+": "+esc(In[x[0]])+"</div>"}).join("")+"</div>")+"</div>";
  // gastos
  var gs=(D.gastos||[]).filter(function(g){return String(g.desc||"").trim()||pcNum(g.costo)});
  if(gs.length)h+="<div class='card'><h2>Estimación de gastos</h2><table><tr><th>Reparación / servicio</th><th class='n'>Costo estimado</th></tr>"+gs.map(function(g){return "<tr><td>"+esc(g.desc||"-")+"</td><td class='n'>"+pcPlata(g.costo)+"</td></tr>"}).join("")+
   "<tr><td class='bad'>TOTAL ESTIMADO</td><td class='n bad'>"+pcPlata(pcGastosTotal(D))+"</td></tr></table></div>";
  // recomendación y riesgo
  var rc=riesgo==="bajo"?"var(--ok)":riesgo==="moderado"?"var(--w)":"var(--bad)";
  h+="<div class='g2'><div class='card'><h2>Recomendación final</h2><div class='recom' style='color:"+pcRgb(pcRecomCol(recom))+"'>"+esc(pcRecomTxt(recom))+"</div>"+(D.recom_txt?"<p style='margin:8px 0 0'>"+esc(D.recom_txt)+"</p>":"")+"</div>"+
   "<div class='card'><h2>Riesgo de compra</h2><svg viewBox='0 0 120 70' width='180' role='img' aria-label='Riesgo "+riesgo+"'><path d='M15 60 A45 45 0 0 1 37.5 21' stroke='#2ea043' stroke-width='12' fill='none'/><path d='M39.5 20 A45 45 0 0 1 80.5 20' stroke='#f2a900' stroke-width='12' fill='none'/><path d='M82.5 21 A45 45 0 0 1 105 60' stroke='#d71920' stroke-width='12' fill='none'/>"+
   "<line x1='60' y1='60' x2='"+(60+36*Math.cos((riesgo==="bajo"?210:riesgo==="moderado"?270:330)*Math.PI/180))+"' y2='"+(60+36*Math.sin((riesgo==="bajo"?210:riesgo==="moderado"?270:330)*Math.PI/180))+"' stroke='currentColor' stroke-width='3' stroke-linecap='round'/><circle cx='60' cy='60' r='4' fill='currentColor'/></svg>"+
   "<div style='font:800 1.3rem \"Barlow Condensed\";text-transform:uppercase;color:"+rc+"'>Riesgo "+esc(riesgo)+"</div></div></div>";
  // observaciones y responsable
  var R=D.responsable||{};
  if(D.observaciones)h+="<div class='card'><h2>Observaciones generales</h2><p style='margin:0;white-space:pre-line'>"+esc(D.observaciones)+"</p></div>";
  var firma=D.firma_ruta||K.firma_ruta;
  if(R.nombre)h+="<div class='card'><h2>Responsable de la inspección</h2><b>"+esc(R.nombre)+"</b><br><span class='muted'>Mecánico matriculado"+(R.matricula?" · MP: "+esc(R.matricula):"")+"</span>"+(firma?"<br><img src=\""+esc(pcUrlFoto(firma))+"\" alt='Firma' style='max-height:80px;max-width:220px;background:#fff;border-radius:8px;margin-top:8px'>":"")+"</div>";
  // galería completa
  var todas=[F.principal].concat(F.galeria||[],PC_NEU.map(function(n){return F["neu_"+n[0]]}),[F.frenos,F.escaneo,F.manejo,F.interior]).filter(Boolean);
  if(todas.length)h+="<div class='card'><h2>Todas las fotos</h2><div class='gal'>"+todas.map(function(f){var u=pcUrlFoto(f);return "<a href=\""+esc(u)+"\" target='_blank' rel='noopener'><img src=\""+esc(u)+"\" alt='' loading='lazy'></a>"}).join("")+"</div></div>";
  h+="<div class='card' style='text-align:center'><button class='btn' id='pdf'>Descargar el informe en PDF</button><p class='muted' id='pdfSt' style='margin:8px 0 0;font-size:.9rem'></p></div>";
  // contacto del taller
  var ct=[];if(T.telefono)ct.push("Tel. "+esc(T.telefono));if(T.direccion)ct.push(esc(T.direccion));
  var ig=instagramDe(T.instagram);if(ig)ct.push("<a class='link' href='https://instagram.com/"+esc(ig)+"' target='_blank' rel='noopener'>@"+esc(ig)+"</a>");
  if(urlWeb(T.maps_url))ct.push("<a class='link' href=\""+esc(urlWeb(T.maps_url))+"\" target='_blank' rel='noopener'>Cómo llegar</a>");
  h+="<footer><b>"+esc(T.nombre)+"</b>"+(ct.length?"<br>"+ct.join(" · "):"")+"<br><br>El presente informe refleja únicamente el estado observable del vehículo al momento de la inspección.</footer>";
  m.innerHTML=h;
  document.getElementById("pdf").onclick=async function(){
   var b=this,st=document.getElementById("pdfSt");if(!window.jspdf){st.textContent="No se pudo cargar el generador de PDF. Revisá la conexión.";return}
   b.disabled=true;st.textContent="Armando el PDF…";
   try{var res=await pcPdfInforme(P,T,K);res.doc.save(res.nombre);st.textContent=""}catch(e){st.textContent="No se pudo armar el PDF."}
   b.disabled=false;
  };
})();
</script>
</body>
</html>
